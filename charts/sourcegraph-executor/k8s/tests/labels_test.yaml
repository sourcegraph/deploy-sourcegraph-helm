# sourcegraph.labels is documented as a label for all resources. The first
# suite asserts on every template, so a new template that leaves the labels
# out fails here.
suite: sourcegraph.labels on every resource
templates:
  - "*.yaml"
set:
  executor:
    queueName: test
  sourcegraph:
    labels:
      example.com/cost-center: "1234"
tests:
  - it: should add the labels to every resource
    asserts:
      - equal:
          path: metadata.labels["example.com/cost-center"]
          value: "1234"

  - it: should not add the labels to the pod template
    template: executor.Deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.labels["example.com/cost-center"]
---
# helm-unittest fails a test when any rendered manifest repeats a key, as
# Kustomize does.
suite: unique keys
set:
  executor:
    queueName: test
tests:
  - it: should render a key set in several values once
    set:
      sourcegraph:
        labels: &labels
          example.com/team: platform
          app: from-values
          deploy: from-values
        podLabels: *labels
        podAnnotations: &annotations
          example.com/owner: platform
          kubectl.kubernetes.io/default-container: from-values
      executor:
        labels:
          <<: *labels
          example.com/team: executor
        podLabels:
          <<: *labels
          example.com/team: executor
        serviceLabels: *labels
        podAnnotations:
          <<: *annotations
          example.com/owner: executor
    template: executor.Deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["example.com/team"]
          value: executor
      - equal:
          path: spec.template.metadata.labels["example.com/team"]
          value: executor
      - equal:
          path: spec.template.metadata.labels.app
          value: executor-test
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: executor

  - it: should render no labels key on the Secret when sourcegraph.labels is unset
    template: executor.Secret.yaml
    asserts:
      - notExists:
          path: metadata.labels
