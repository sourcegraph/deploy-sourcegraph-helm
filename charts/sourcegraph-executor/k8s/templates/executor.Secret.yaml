{{- if not .Values.executor.frontendExistingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- include "executor.labels" . | nindent 4 }}
    {{- if .Values.executor.labels }}
      {{- toYaml .Values.executor.labels | nindent 4 }}
    {{- end }}
  name: {{ include "executor.name" . }}
type: Opaque
data:
  EXECUTOR_FRONTEND_PASSWORD: {{ .Values.executor.frontendPassword | b64enc | quote }}
{{- end }}
