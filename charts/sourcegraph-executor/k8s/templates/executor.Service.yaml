apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- if .Values.executor.serviceAnnotations }}
    {{- toYaml .Values.executor.serviceAnnotations | nindent 4 }}
    {{- end }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      (include "executor.labels" .)
      .Values.executor.serviceLabels
    ) | nindent 4 }}
  name: {{ include "executor.name" . }}
spec:
  ports:
  - name: http-debug
    port: 6060
    targetPort: http-debug
  selector:
    {{- include "sourcegraph.selectorLabels" . | nindent 4 }}
    app: {{ include "executor.name" . }}
  type: {{ .Values.executor.serviceType | default "ClusterIP" }}
