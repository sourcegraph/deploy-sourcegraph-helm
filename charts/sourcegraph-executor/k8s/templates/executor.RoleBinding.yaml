{{- if .Values.executor.configureRbac }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sg-executor-role-binding
  labels:
    {{- include "sourcegraph.mergedLabels" (list . .Values.executor.labels (dict "category" "rbac" "deploy" "sourcegraph" "sourcegraph-resource-requires" "cluster-admin" "app.kubernetes.io/component" "executor")) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sg-executor
roleRef:
  kind: Role
  name: sg-executor-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
