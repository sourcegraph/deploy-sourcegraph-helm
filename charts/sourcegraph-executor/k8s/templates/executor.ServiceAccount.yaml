{{- if .Values.executor.configureRbac }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sg-executor
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      "category: rbac"
      "deploy: sourcegraph"
      "sourcegraph-resource-requires: cluster-admin"
      "app.kubernetes.io/component: executor"
    ) | nindent 4 }}
{{- end }}
