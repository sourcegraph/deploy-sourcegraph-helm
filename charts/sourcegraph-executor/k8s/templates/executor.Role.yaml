{{- if .Values.executor.configureRbac }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sg-executor-role
  labels:
    {{- include "sourcegraph.mergedLabels" (list . .Values.executor.labels (dict "category" "rbac" "deploy" "sourcegraph" "sourcegraph-resource-requires" "cluster-admin" "app.kubernetes.io/component" "executor")) | nindent 4 }}
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
      - persistentvolumeclaims
    verbs:
      - create
      - delete
{{- end }}
