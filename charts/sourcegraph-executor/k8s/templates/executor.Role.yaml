{{- if .Values.executor.configureRbac }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sg-executor-role
  labels:
    category: rbac
    deploy: sourcegraph
    sourcegraph-resource-requires: cluster-admin
    app.kubernetes.io/component: executor
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
  {{- if .Values.executor.cleanup.enabled }}
  # The cleanup CronJob lists leftover job resources, and kubectl delete gets each one first
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - secrets
      - persistentvolumeclaims
    verbs:
      - get
      - list
  {{- end }}
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - create
      - delete
{{- end }}
