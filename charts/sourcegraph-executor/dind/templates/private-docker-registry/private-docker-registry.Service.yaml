{{- if .Values.privateDockerRegistry.enabled -}}
apiVersion: v1
kind: Service
metadata:
  {{- if .Values.privateDockerRegistry.serviceAnnotations }}
    annotations:
    {{- toYaml .Values.privateDockerRegistry.serviceAnnotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (dict "app" "private-docker-registry" "deploy" "sourcegraph" "app.kubernetes.io/component" "private-docker-registry") .Values.privateDockerRegistry.serviceLabels) | nindent 4 }}
  name: private-docker-registry
spec:
  ports:
    - name: http
      port: 5000
      protocol: TCP
      targetPort: http
  selector:
    app: private-docker-registry
  type: ClusterIP
{{- end }}
