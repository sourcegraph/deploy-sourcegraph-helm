{{- if .Values.privateDockerRegistry.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: private-docker-registry
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      (include "sourcegraph.labels" .)
      .Values.privateDockerRegistry.labels
      "deploy: sourcegraph"
      "app.kubernetes.io/component: private-docker-registry"
    ) | nindent 4 }}
spec:
  replicas: 1
  serviceName: private-docker-registry
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" . | nindent 6 }}
      app: private-docker-registry
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        {{- include "sourcegraph.uniqueKeys" (list
          "kubectl.kubernetes.io/default-container: private-docker-registry"
          .Values.sourcegraph.podAnnotations
          .Values.privateDockerRegistry.podAnnotations
        ) | nindent 8 }}
      labels:
        {{- include "sourcegraph.uniqueKeys" (list
          (include "sourcegraph.selectorLabels" .)
          .Values.sourcegraph.podLabels
          .Values.privateDockerRegistry.podLabels
          "deploy: sourcegraph"
          "app: private-docker-registry"
        ) | nindent 8 }}
    spec:
      containers:
        - name: private-docker-registry
          image: {{ .Values.privateDockerRegistry.image.registry}}/{{ .Values.privateDockerRegistry.image.repository}}:{{ .Values.privateDockerRegistry.image.tag}}
          imagePullPolicy: {{ .Values.sourcegraph.image.pullPolicy }}
          env:
            {{- range $name, $item := .Values.privateDockerRegistry.env }}
            - name: {{ $name }}
              {{- $item | toYaml | nindent 14 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 5000
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /var/lib/registry
              name: cache
      {{- with .Values.sourcegraph.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sourcegraph.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "sourcegraph.priorityClassName" (list . "privateDockerRegistry") | trim }}{{ . | nindent 6 }}{{- end }}
      {{- with .Values.sourcegraph.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sourcegraph.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: cache
        labels:
          deploy: sourcegraph
          app.kubernetes.io/component: private-docker-registry
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.privateDockerRegistry.storageSize }}
        storageClassName: {{ .Values.storageClass.name }}
{{- end }}
