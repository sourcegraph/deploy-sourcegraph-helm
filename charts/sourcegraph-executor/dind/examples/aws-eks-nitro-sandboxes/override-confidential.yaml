# Run the executor pod and the private Docker registry in confidential-sandbox
# with EKS Nitro Sandboxes. Use it on top of override.yaml:
#   helm upgrade ... -f override.yaml -f override-confidential.yaml
#
# Confidential mode needs a policy for both pods. Generate them as described
# in the sourcegraph chart's
# examples/aws-eks-nitro-sandboxes/override-confidential.yaml
#
# The executor Deployment needs two changes:
# - Before generating, change the executor-scratch volume from "emptyDir:" to
#   "emptyDir: {}" in the manifest. With executor.storage.size unset, the
#   chart renders it with no value, and the generator then expects a pod with
#   no emptyDir volume
# - After generating, remove the pod's context.mounts conditions from the
#   policy, because the pinned source of its subPath mount does not match
#
# The private-docker-registry StatefulSet needs only the volumeClaimTemplates
# step.
#
# Jobs run as Docker containers inside the executor pod's sandbox, so they
# need no policy of their own

sourcegraph:
  runtimeClassName: confidential-sandbox

executor:
  podAnnotations:
    sandbox.amazonaws.com/policy: <policy of the executor Deployment>

privateDockerRegistry:
  podAnnotations:
    sandbox.amazonaws.com/policy: <policy of the private-docker-registry StatefulSet>
