suite: executor
templates:
  - executor/docker-daemon.ConfigMap.yaml
  - executor/executor.Deployment.yaml
tests:
  - it: should render the ConfigMap and a single Deployment named after the queue
    set:
      executor:
        queueName: batches
    asserts:
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: docker-config
        template: executor/docker-daemon.ConfigMap.yaml
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: executor-batches
        template: executor/executor.Deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXECUTOR_QUEUE_NAME
            value: batches
        template: executor/executor.Deployment.yaml

  - it: should render one Deployment per entry in queues
    template: executor/executor.Deployment.yaml
    set:
      queues:
        - name: codeintel
        - name: batches
          queueName: batches
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: executor-codeintel
        documentIndex: 0
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: executor-batches
        documentIndex: 1

  - it: should add executor.storage.labels to the per-pod PVC
    template: executor/executor.Deployment.yaml
    set:
      executor:
        queueName: batches
        storage:
          type: ephemeral
          size: 50Gi
          labels:
            example.com/project: sourcegraph
            example.com/service: executor
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.metadata
          value:
            labels:
              example.com/project: sourcegraph
              example.com/service: executor
      - equal:
          path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.spec.resources.requests.storage
          value: 50Gi

  - it: should render no PVC metadata when executor.storage.labels is empty
    template: executor/executor.Deployment.yaml
    set:
      executor:
        queueName: batches
        storage:
          type: ephemeral
          size: 50Gi
    asserts:
      - notExists:
          path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.metadata

  - it: should ignore executor.storage.labels on an emptyDir volume
    template: executor/executor.Deployment.yaml
    set:
      executor:
        queueName: batches
        storage:
          labels:
            example.com/project: sourcegraph
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: executor-scratch
      - notExists:
          path: spec.template.spec.volumes[0].ephemeral
