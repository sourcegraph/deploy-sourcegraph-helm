suite: executor
templates:
  - executor/docker-daemon.ConfigMap.yaml
  - executor/executor.Deployment.yaml
tests:
  - it: should render the ConfigMap and a single Deployment named after the queue
    set:
      executor:
        queueName: batches
    asserts:
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: docker-config
        template: executor/docker-daemon.ConfigMap.yaml
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: executor-batches
        template: executor/executor.Deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXECUTOR_QUEUE_NAME
            value: batches
        template: executor/executor.Deployment.yaml

  - it: should render one Deployment per entry in queues
    template: executor/executor.Deployment.yaml
    set:
      queues:
        - name: codeintel
        - name: batches
          queueName: batches
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: executor-codeintel
        documentIndex: 0
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: executor-batches
        documentIndex: 1

  # The chart version is part of the helm.sh/chart label, so pin it to compare whole label sets.
  - it: should add sourcegraph.labels, the chart's labels, and executor.storage.labels to the per-pod PVC
    template: executor/executor.Deployment.yaml
    release:
      name: executor
    chart:
      version: 1.2.3
      appVersion: 1.2.3
    set:
      sourcegraph:
        labels:
          example.com/project: sourcegraph
      executor:
        queueName: batches
        storage:
          type: ephemeral
          size: 50Gi
          labels:
            example.com/service: executor
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.metadata
          value:
            labels:
              helm.sh/chart: sourcegraph-executor-dind-1.2.3
              app.kubernetes.io/name: sourcegraph-executor-dind
              app.kubernetes.io/instance: executor
              app.kubernetes.io/version: 1.2.3
              app.kubernetes.io/managed-by: Helm
              example.com/project: sourcegraph
              example.com/service: executor
              deploy: sourcegraph
              app.kubernetes.io/component: executor
      - equal:
          path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.spec.resources.requests.storage
          value: 50Gi

  - it: should add only the chart's own labels to the per-pod PVC when no label value is set
    template: executor/executor.Deployment.yaml
    release:
      name: executor
    chart:
      version: 1.2.3
      appVersion: 1.2.3
    set:
      executor:
        queueName: batches
        storage:
          type: ephemeral
          size: 50Gi
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.metadata
          value:
            labels:
              helm.sh/chart: sourcegraph-executor-dind-1.2.3
              app.kubernetes.io/name: sourcegraph-executor-dind
              app.kubernetes.io/instance: executor
              app.kubernetes.io/version: 1.2.3
              app.kubernetes.io/managed-by: Helm
              deploy: sourcegraph
              app.kubernetes.io/component: executor

  - it: should ignore executor.storage.labels on an emptyDir volume
    template: executor/executor.Deployment.yaml
    set:
      executor:
        queueName: batches
        storage:
          labels:
            example.com/project: sourcegraph
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: executor-scratch
      - notExists:
          path: spec.template.spec.volumes[0].ephemeral
