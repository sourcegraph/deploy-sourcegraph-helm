suite: executor
templates:
  - executor/docker-daemon.ConfigMap.yaml
  - executor/executor.Deployment.yaml
tests:
  - it: should render the ConfigMap and a single Deployment named after the queue
    set:
      executor:
        queueName: batches
    asserts:
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: docker-config
        template: executor/docker-daemon.ConfigMap.yaml
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: executor-batches
        template: executor/executor.Deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXECUTOR_QUEUE_NAME
            value: batches
        template: executor/executor.Deployment.yaml

  - it: should render one Deployment per entry in queues
    template: executor/executor.Deployment.yaml
    set:
      queues:
        - name: codeintel
        - name: batches
          queueName: batches
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: executor-codeintel
        documentIndex: 0
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: executor-batches
        documentIndex: 1

  - it: should not set runtimeClassName by default
    template: executor/executor.Deployment.yaml
    set:
      executor:
        queueName: batches
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: should default runtimeClassName to gvisor when gVisor is enabled
    template: executor/executor.Deployment.yaml
    set:
      executor:
        queueName: batches
      dind:
        gVisor:
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: gvisor

  - it: should prefer executor.runtimeClassName over the global one and the gVisor default
    template: executor/executor.Deployment.yaml
    set:
      sourcegraph:
        runtimeClassName: global-class
      executor:
        queueName: batches
        runtimeClassName: executor-class
      dind:
        gVisor:
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: executor-class
