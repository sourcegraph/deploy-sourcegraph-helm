# sourcegraph.labels is documented as a label for every resource the chart
# creates. The first suite asserts on every template, so a new template that
# leaves the labels out fails here.
suite: sourcegraph.labels on every resource
templates:
  - "*/*.yaml"
set:
  queues:
    - name: batches
    - name: codeintel
  sourcegraph:
    labels:
      example.com/cost-center: "1234"
tests:
  - it: should add the labels to every resource
    asserts:
      - equal:
          path: metadata.labels["example.com/cost-center"]
          value: "1234"

  - it: should not add the labels to pod templates and the volume claim template
    template: private-docker-registry/private-docker-registry.Statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.labels["example.com/cost-center"]
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.labels["example.com/cost-center"]
---
# helm-unittest fails a test when any rendered manifest repeats a key, as
# Kustomize does.
suite: unique keys
set:
  executor:
    queueName: test
tests:
  - it: should render a key set in several values once
    set:
      sourcegraph:
        labels: &labels
          example.com/team: platform
          app: from-values
          deploy: from-values
          helm.sh/chart: from-values
        podLabels: &podLabels
          example.com/team: platform
          app: from-values
          deploy: from-values
        podAnnotations: &annotations
          example.com/owner: platform
          kubectl.kubernetes.io/default-container: from-values
      executor: &component
        labels:
          <<: *labels
          example.com/team: component
        podLabels:
          <<: *podLabels
          example.com/team: component
        podAnnotations:
          <<: *annotations
          example.com/owner: component
      privateDockerRegistry: *component
    templates:
      - executor/executor.Deployment.yaml
      - private-docker-registry/private-docker-registry.Statefulset.yaml
    asserts:
      - equal:
          path: metadata.labels["example.com/team"]
          value: component
      - equal:
          path: metadata.labels.deploy
          value: sourcegraph
      - equal:
          path: spec.template.metadata.labels["example.com/team"]
          value: component
      - equal:
          path: spec.template.metadata.labels.deploy
          value: sourcegraph
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: component
