suite: privateDockerRegistry
templates:
  - private-docker-registry/private-docker-registry.Statefulset.yaml
  - private-docker-registry/private-docker-registry.Service.yaml
tests:
  - it: should render the StatefulSet and Service if registry is enabled
    set:
      privateDockerRegistry:
        enabled: true
    asserts:
      - containsDocument:
          kind: StatefulSet
          apiVersion: apps/v1
          name: private-docker-registry
        template: private-docker-registry/private-docker-registry.Statefulset.yaml
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: private-docker-registry
        template: private-docker-registry/private-docker-registry.Service.yaml

  - it: should not render any resources if registry is disabled
    set:
      privateDockerRegistry:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the registry's own nodeSelector and podSecurityContext
    template: private-docker-registry/private-docker-registry.Statefulset.yaml
    set:
      sourcegraph:
        nodeSelector:
          pool: global
      privateDockerRegistry:
        nodeSelector:
          pool: registry
        podSecurityContext:
          fsGroup: 1000
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: registry
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
