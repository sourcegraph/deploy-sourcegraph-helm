# Used by CI: the "Render charts through kustomize" GitHub Actions job
# (.github/workflows/kustomize_render.yml) renders this chart with this file
# through scripts/ci/kustomize-render.sh.
#
# The same label and annotation keys at the global and per-component levels,
# where the per-component value should win. Without deduplication, the chart
# renders the key twice in one map, which kustomize rejects.

sourcegraph:
  labels:
    example.com/team: platform
  podLabels:
    example.com/team: platform
  podAnnotations:
    metrics.example.com/port: "9090"

executor:
  frontendUrl: https://sourcegraph.example.com
  frontendExistingSecret: example-secret
  queueName: batches
  labels:
    example.com/team: executors
  podLabels:
    example.com/team: executors
  podAnnotations:
    metrics.example.com/port: "6060"

privateDockerRegistry:
  labels:
    example.com/team: registry
  podLabels:
    example.com/team: registry
  podAnnotations:
    metrics.example.com/port: "6060"
