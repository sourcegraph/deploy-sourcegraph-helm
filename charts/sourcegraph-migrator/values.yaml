# These values are derived from https://github.com/sourcegraph/deploy-sourcegraph-helm/blob/main/charts/sourcegraph/values.yaml

# -- Replaces the chart name in the `app.kubernetes.io/name` label of the migrator Job and its pod.
# The chart has no selector, so it can be changed on an installed release.
# As a subchart with an `alias`, the alias replaces the chart name; set `<alias>.nameOverride: sourcegraph-migrator`
# in the parent chart to keep the label of a standalone install.
nameOverride: ""

### Common Configuration ###
sourcegraph:
  image:
    # -- Global docker image tag
    defaultTag: '{{ .Chart.AppVersion }}'
    # -- Global docker image pull policy
    pullPolicy: IfNotPresent
    # -- Global docker image registry or prefix
    # @default -- Sourcegraph's public Docker Hub registry
    repository: index.docker.io/sourcegraph
    # -- When set to true, sourcegraph.image.defaultTag is used as the default defaultTag for all services, instead of service-specific default defaultTags
    useGlobalTagAsDefault: false
  # -- Mount named secrets containing docker credentials
  imagePullSecrets: []
  # -- Add a global label to all resources
  labels: {}
  # -- Default affinity for every pod. `migrator.affinity` replaces it when set,
  # learn more from the [Kubernetes documentation](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity)
  affinity: {}
  # -- Default nodeSelector for every pod. `migrator.nodeSelector` replaces it when set,
  # learn more from the [Kubernetes documentation](https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector)
  nodeSelector: {}
  # -- Default tolerations for every pod. `migrator.tolerations` replaces it when set,
  # learn more from the [Kubernetes documentation](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/)
  tolerations: []
  # -- Add extra annotations to attach to all pods
  podAnnotations: {}
  # -- Add extra labels to attach to all pods
  podLabels: {}
  # -- Assign a priorityClass to all pods (daemonSets, deployments, and statefulSets)
  priorityClassName: ""


codeInsightsDB:
  name: "codeinsights-db"
  auth:
    # -- Name of existing secret to use for codeinsights-db credentials
    # This should match the setting in the sourcegraph chart values
    existingSecret: ""

codeIntelDB:
  name: "codeintel-db"
  auth:
    # -- Name of existing secret to use for codeintel-db credentials
    # This should match the setting in the sourcegraph chart values
    existingSecret: ""

pgsql:
  name: "pgsql"
  auth:
    # -- Name of existing secret to use for pgsql credentials
    # This should match the setting in the sourcegraph chart values
    existingSecret: ""

migrator:
  image:
    # -- Docker image tag for the `migrator` image
    # @default -- `<appVersion>@sha256:<digest>`, pinned by each release
    defaultTag: 8.1.4873@sha256:1683031a37687f672f4d40ba3508099e239881f9eab82e2faeed1e672ea4b60f
    # -- Docker image name for the `migrator` image
    name: "migrator"
  # -- Environment variables for the `migrator` container
  env: {}
  # -- Resource requests & limits for the `migrator` container,
  # learn more from the [Kubernetes documentation](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/)
  resources:
    limits:
      cpu: 500m
      memory: 100M
    requests:
      cpu: 100m
      memory: 50M
  # -- Security context for the `migrator` container,
  # learn more from the [Kubernetes documentation](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container)
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsUser: 100
    runAsGroup: 101
    readOnlyRootFilesystem: true
  # -- Name prefix of the migrator Job. A random suffix is added to every release's Job.
  name: ""
  # -- Labels for the migrator Job
  labels: {}
  # -- Annotations for the migrator pod
  podAnnotations: {}
  # -- Labels for the migrator pod
  podLabels: {}
  # -- Pod-level security context for the migrator pod,
  # learn more from the [Kubernetes documentation](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod)
  podSecurityContext: {}
  # -- Node selector for the migrator pod. Replaces `sourcegraph.nodeSelector` when set,
  # learn more from the [Kubernetes documentation](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
  nodeSelector: {}
  # -- Affinity for the migrator pod. Replaces `sourcegraph.affinity` when set,
  # learn more from the [Kubernetes documentation](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity)
  affinity: {}
  # -- Tolerations for the migrator pod. Replaces `sourcegraph.tolerations` when set,
  # learn more from the [Kubernetes documentation](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/)
  tolerations: []
  # -- Extra volumes for the migrator pod
  extraVolumes: []
  # -- Extra volume mounts for the `migrator` container
  extraVolumeMounts: []
  # -- Extra containers in the migrator pod
  extraContainers: []
  # -- Override default `migrator` container args
  # Available commands can be found at
  # https://docs.sourcegraph.com/admin/how-to/manual_database_migrations
  args:
  - up
  - -db=all
