{{- if and .Values.codeInsightsDB.enabled .Values.codeInsightsDB.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- with include "sourcegraph.serviceAccountLabels" (list . "codeInsightsDB") }}
    {{- . | nindent 4 }}
    {{- end }}
    category: rbac
    deploy: sourcegraph
    app.kubernetes.io/component: codeinsights-db
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "codeInsightsDB") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "codeInsightsDB") }}
{{- end }}
