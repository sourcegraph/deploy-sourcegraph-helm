{{- if .Values.codeInsightsDB.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      `prometheus.io/port: "9187"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.codeInsightsDB.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      "app.kubernetes.io/component: codeinsights-db"
      "app: codeinsights-db"
      "deploy: sourcegraph"
      .Values.codeInsightsDB.serviceLabels
    ) | nindent 4 }}
  name: codeinsights-db
spec:
  ports:
  - name: http-metrics
    port: 9187
    targetPort: http-metrics
  - name: codeinsights-db
    port: 5432
    targetPort: codeinsights-db
  {{- with .Values.codeInsightsDB.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.codeInsightsDB) | nindent 4 }}
    app: codeinsights-db
  type: {{ .Values.codeInsightsDB.serviceType | default "ClusterIP" }}
{{- end }}
