{{- if .Values.codeInsightsDB.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    {{- with include "sourcegraph.objectLabels" (list . .Values.codeInsightsDB) }}
    {{- . | nindent 4 }}
    {{- end }}
    app.kubernetes.io/component: codeinsights-db
    deploy: sourcegraph
  {{- if .Values.codeInsightsDB.storageAnnotations }}
  annotations:
    {{- toYaml .Values.codeInsightsDB.storageAnnotations | nindent 4 }}
  {{- end }}
  name: codeinsights-db
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.codeInsightsDB.storageSize }}
  storageClassName: {{ .Values.storageClass.name }}
  {{- if .Values.codeInsightsDB.volumeName }}
  volumeName: {{ .Values.codeInsightsDB.volumeName }}
  {{- end }}
{{- end }}
