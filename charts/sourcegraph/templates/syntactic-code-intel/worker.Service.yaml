{{- if .Values.syntacticCodeIntel.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      `prometheus.io/port: "6060"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.syntacticCodeIntel.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      "app: syntactic-code-intel-worker"
      "deploy: sourcegraph"
      "app.kubernetes.io/component: syntactic-code-intel"
      .Values.syntacticCodeIntel.serviceLabels
    ) | nindent 4 }}
  name: syntactic-code-intel-worker
spec:
  ports:
  - name: http-debug
    port: 6060
    targetPort: http-debug
  {{- with .Values.syntacticCodeIntel.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.syntacticCodeIntel) | nindent 4 }}
    app: syntactic-code-intel-worker
  type: {{ .Values.syntacticCodeIntel.serviceType | default "ClusterIP" }}
{{- end }}
