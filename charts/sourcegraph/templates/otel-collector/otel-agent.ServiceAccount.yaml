{{- if .Values.openTelemetry.agent.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list .Values.openTelemetry "agent") | fromYaml) (dict "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "otel-collector")) | nindent 4 }}
  {{- include "sourcegraph.serviceAccountAnnotations" (list .Values.openTelemetry "agent") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list .Values.openTelemetry "agent") }}
{{- end }}
