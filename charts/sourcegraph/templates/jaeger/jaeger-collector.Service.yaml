{{- if .Values.jaeger.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
  {{- if .Values.jaeger.collector.serviceAnnotations }}
  {{- toYaml .Values.jaeger.collector.serviceAnnotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      .Values.sourcegraph.serviceLabels
      "deploy: sourcegraph"
      "app.kubernetes.io/component: all-in-one"
      "app: jaeger"
      "app.kubernetes.io/name: jaeger"
      .Values.jaeger.collector.serviceLabels
    ) | nindent 4 }}
  name: {{ default "jaeger-collector" .Values.jaeger.collector.name }}
spec:
  ports:
  - name: http-otlp
    port: 4318
    protocol: TCP
    targetPort: http-otlp
  - name: grpc-otlp
    port: 4317
    protocol: TCP
    targetPort: grpc-otlp
  {{- with .Values.jaeger.collector.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.jaeger.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: all-in-one
    app: jaeger
  type: {{ .Values.jaeger.collector.serviceType | default "ClusterIP" }}
{{- end }}
