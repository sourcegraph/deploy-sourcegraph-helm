{{- if .Values.jaeger.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
  {{- if .Values.jaeger.query.serviceAnnotations }}
  {{- toYaml .Values.jaeger.query.serviceAnnotations | nindent 4 }}
  {{- end }}
  labels:
    {{- with include "sourcegraph.serviceLabels" (list . .Values.jaeger.query) }}
    {{- . | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: all-in-one
    app: jaeger
    app.kubernetes.io/name: jaeger
  name: {{ default "jaeger-query" .Values.jaeger.query.name }}
spec:
  ports:
  - name: http
    port: 16686
    protocol: TCP
    targetPort: http
  {{- with .Values.jaeger.query.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.jaeger.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: all-in-one
    app: jaeger
  type: {{ .Values.jaeger.query.serviceType | default "ClusterIP" }}
{{- end }}
