{{- if and .Values.jaeger.enabled .Values.jaeger.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- with include "sourcegraph.serviceAccountLabels" (list . "jaeger") }}
    {{- . | nindent 4 }}
    {{- end }}
    category: rbac
    deploy: sourcegraph
    app.kubernetes.io/component: tracing
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "jaeger") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "jaeger") }}
{{- end }}
