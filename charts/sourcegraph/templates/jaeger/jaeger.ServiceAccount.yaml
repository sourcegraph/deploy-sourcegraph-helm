{{- if and .Values.jaeger.enabled .Values.jaeger.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list . "jaeger") | fromYaml) (dict "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "tracing")) | nindent 4 }}
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "jaeger") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "jaeger") }}
{{- end }}
