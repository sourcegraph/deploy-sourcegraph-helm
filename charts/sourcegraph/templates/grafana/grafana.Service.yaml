{{- if .Values.grafana.enabled -}}
apiVersion: v1
kind: Service
metadata:
  {{- if .Values.grafana.serviceAnnotations }}
  annotations:
  {{- toYaml .Values.grafana.serviceAnnotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      "app: grafana"
      "deploy: sourcegraph"
      "app.kubernetes.io/component: grafana"
      .Values.grafana.serviceLabels
    ) | nindent 4 }}
  name: grafana
spec:
  ports:
  - name: http
    port: 30070
    targetPort: http
  {{- with .Values.grafana.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.grafana) | nindent 4 }}
    app: grafana
  type: {{ .Values.grafana.serviceType | default "ClusterIP" }}
{{- end }}
