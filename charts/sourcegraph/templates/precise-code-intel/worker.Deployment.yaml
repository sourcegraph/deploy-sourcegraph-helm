apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Handles conversion of uploaded precise code intelligence bundles.
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- if .Values.preciseCodeIntel.labels }}
      {{- toYaml .Values.preciseCodeIntel.labels | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: precise-code-intel
  name: {{ .Values.preciseCodeIntel.name }}
spec:
  minReadySeconds: 10
  replicas: {{ .Values.preciseCodeIntel.replicaCount }}
  revisionHistoryLimit: {{ .Values.sourcegraph.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" . | nindent 6 }}
      app: precise-code-intel-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: precise-code-intel-worker
      {{- if .Values.sourcegraph.podAnnotations }}
      {{- toYaml .Values.sourcegraph.podAnnotations | nindent 8 }}
      {{- end }}
      {{- if .Values.preciseCodeIntel.podAnnotations }}
      {{- toYaml .Values.preciseCodeIntel.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
      {{- include "sourcegraph.selectorLabels" . | nindent 8 }}
      {{- if .Values.sourcegraph.podLabels }}
      {{- toYaml .Values.sourcegraph.podLabels | nindent 8 }}
      {{- end }}
      {{- if .Values.preciseCodeIntel.podLabels }}
      {{- toYaml .Values.preciseCodeIntel.podLabels | nindent 8 }}
      {{- end }}
        deploy: sourcegraph
        app: precise-code-intel-worker
    spec:
      {{- $storageType := .Values.preciseCodeIntel.storageType | default "emptyDir" }}
      {{- if not (has $storageType (list "emptyDir" "pvc")) }}
      {{- fail (printf "preciseCodeIntel.storageType must be one of emptyDir, pvc; got %q" $storageType) }}
      {{- end }}
      {{- include "sourcegraph.terminationGracePeriodSeconds" (list . "preciseCodeIntel") | nindent 6 }}
      containers:
      - name: precise-code-intel-worker
        env:
        {{- include "sourcegraph.gracefulShutdownEnv" (list . "preciseCodeIntel") | nindent 8 }}
        {{- range $name, $item := .Values.preciseCodeIntel.env}}
        - name: {{ $name }}
          {{- $item | toYaml | nindent 10 }}
        {{- end }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- if .Values.blobstore.enabled }}
        - name: PRECISE_CODE_INTEL_UPLOAD_BACKEND
          value: blobstore
        - name: PRECISE_CODE_INTEL_UPLOAD_AWS_ENDPOINT
          value: http://blobstore:9000
        {{- end }}
        {{- include "sourcegraph.openTelemetryEnv" . | nindent 8 }}
        image: {{ include "sourcegraph.image" (list . "preciseCodeIntel") }}
        imagePullPolicy: {{ .Values.sourcegraph.image.pullPolicy }}
        {{- with .Values.preciseCodeIntel.args }}
        args:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        terminationMessagePolicy: FallbackToLogsOnError
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-debug
            scheme: HTTP
          initialDelaySeconds: 60
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http-debug
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 5
        ports:
        - name: http-debug
          containerPort: 6060
        {{- if not .Values.sourcegraph.localDevMode }}
        resources:
          {{- toYaml .Values.preciseCodeIntel.resources | nindent 10 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.preciseCodeIntel.containerSecurityContext | nindent 10 }}
        volumeMounts:
        - mountPath: /tmp
          name: tmpdir
        {{- if .Values.preciseCodeIntel.extraVolumeMounts }}
        {{- toYaml .Values.preciseCodeIntel.extraVolumeMounts | nindent 8 }}
        {{- end }}
      {{- if .Values.preciseCodeIntel.extraContainers }}
        {{- toYaml .Values.preciseCodeIntel.extraContainers | nindent 6 }}
      {{- end }}
      {{- $podSecurityContext := deepCopy .Values.preciseCodeIntel.podSecurityContext }}
      {{- if eq $storageType "pvc" }}
      {{- /* A freshly provisioned volume is root-owned, so the non-root worker needs fsGroup to write /tmp. */}}
      {{- $podSecurityContext = merge $podSecurityContext (dict "fsGroup" (.Values.preciseCodeIntel.containerSecurityContext.runAsGroup | default 101) "fsGroupChangePolicy" "OnRootMismatch") }}
      {{- end }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      {{- include "sourcegraph.nodeSelector" (list . "preciseCodeIntel" ) | trim | nindent 6 }}
      {{- include "sourcegraph.affinity" (list . "preciseCodeIntel" ) | trim | nindent 6 }}
      {{- with include "sourcegraph.priorityClassName" (list . "preciseCodeIntel" ) | trim }}{{ . | nindent 6 }}{{- end }}
      {{- include "sourcegraph.tolerations" (list . "preciseCodeIntel" ) | trim | nindent 6 }}
      {{- with .Values.sourcegraph.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "sourcegraph.renderServiceAccountName" (list . "preciseCodeIntel") | trim | nindent 6 }}
      volumes:
      - name: tmpdir
        {{- if eq $storageType "pvc" }}
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: {{ required "preciseCodeIntel.storageSize is required when preciseCodeIntel.storageType is pvc" .Values.preciseCodeIntel.storageSize }}
              {{- with .Values.preciseCodeIntel.storageClassName }}
              storageClassName: {{ . }}
              {{- end }}
        {{- else if .Values.preciseCodeIntel.storageSize }}
        emptyDir:
          sizeLimit: {{ .Values.preciseCodeIntel.storageSize }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.preciseCodeIntel.extraVolumes }}
      {{- toYaml .Values.preciseCodeIntel.extraVolumes | nindent 6 }}
      {{- end }}
