apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      `prometheus.io/port: "6060"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.preciseCodeIntel.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      "app: precise-code-intel-worker"
      "deploy: sourcegraph"
      "app.kubernetes.io/component: precise-code-intel"
      .Values.preciseCodeIntel.serviceLabels
    ) | nindent 4 }}
  name: precise-code-intel-worker
spec:
  ports:
  - name: http-debug
    port: 6060
    targetPort: http-debug
  {{- with .Values.preciseCodeIntel.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.preciseCodeIntel) | nindent 4 }}
    app: precise-code-intel-worker
  type: {{ .Values.preciseCodeIntel.serviceType | default "ClusterIP" }}
