{{- if .Values.searcher.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- if .Values.searcher.labels }}
      {{- toYaml .Values.searcher.labels | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: searcher
  name: {{ .Values.searcher.name }}
spec:
  {{- toYaml .Values.searcher.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.searcher) | nindent 6 }}
      app: searcher
{{- end }}
