apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      `prometheus.io/port: "6060"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.searcher.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      "app: searcher"
      "deploy: sourcegraph"
      "app.kubernetes.io/component: searcher"
      .Values.searcher.serviceLabels
    ) | nindent 4 }}
  name: searcher
spec:
  clusterIP: None
  ports:
  - name: grpc
    port: 3181
    targetPort: grpc
  - name: http-debug
    port: 6060
    targetPort: http-debug
  {{- with .Values.searcher.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.searcher) | nindent 4 }}
    app: searcher
