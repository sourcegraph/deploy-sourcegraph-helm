{{- if .Values.redisStore.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      `prometheus.io/port: "9121"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.redisStore.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      "app: redis-store"
      "deploy: sourcegraph"
      "app.kubernetes.io/component: redis"
      .Values.redisStore.serviceLabels
    ) | nindent 4 }}
  name: redis-store
spec:
  ports:
  - name: http-metrics
    port: 9121
    targetPort: http-metrics
  - name: redis
    port: 6379
    targetPort: redis
  {{- with .Values.redisStore.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.redisStore) | nindent 4 }}
    app: redis-store
  type: {{ .Values.redisStore.serviceType | default "ClusterIP" }}
{{- end }}
