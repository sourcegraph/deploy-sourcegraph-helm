{{- if .Values.redisCache.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . .Values.redisCache.storageLabels (dict "deploy" "sourcegraph" "app.kubernetes.io/component" "redis")) | nindent 4 }}
  {{- if .Values.redisCache.storageAnnotations }}
  annotations:
    {{- toYaml .Values.redisCache.storageAnnotations | nindent 4 }}
  {{- end }}
  name: redis-cache
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redisCache.storageSize }}
  storageClassName: {{ .Values.storageClass.name }}
  {{- if .Values.redisCache.volumeName }}
  volumeName: {{ .Values.redisCache.volumeName }}
  {{- end }}
{{- end }}
