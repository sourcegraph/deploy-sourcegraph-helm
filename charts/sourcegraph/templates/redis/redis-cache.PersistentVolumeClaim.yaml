{{- if .Values.redisCache.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- with .Values.redisCache.storageLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: redis
  {{- if .Values.redisCache.storageAnnotations }}
  annotations:
    {{- toYaml .Values.redisCache.storageAnnotations | nindent 4 }}
  {{- end }}
  name: redis-cache
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redisCache.storageSize }}
  storageClassName: {{ .Values.storageClass.name }}
  {{- if .Values.redisCache.volumeName }}
  volumeName: {{ .Values.redisCache.volumeName }}
  {{- end }}
{{- end }}
