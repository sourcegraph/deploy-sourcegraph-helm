{{- if and .Values.redisCache.enabled .Values.redisCache.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list . "redisCache") | fromYaml) (dict "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "redis")) | nindent 4 }}
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "redisCache") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "redisCache") }}
{{- end }}
