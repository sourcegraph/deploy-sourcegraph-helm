{{- if and .Values.redisStore.enabled .Values.redisStore.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.redisStore.name }}
  {{- with .Values.sourcegraph.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml .Values.redisStore.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.redisStore) | nindent 6 }}
      app: redis-store
{{- end }}
