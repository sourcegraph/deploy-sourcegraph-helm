{{- if and .Values.redisStore.enabled .Values.redisStore.config.enabled -}}
{{- if and .Values.redisStore.config.existingConfig .Values.redisStore.config.additionalConfig -}}
{{- fail "You can only define one of 'redisStore.config.existingConfig' and 'redisStore.config.additionalConfig' at a time" }}
{{- end }}
{{- if not .Values.redisStore.config.existingConfig -}}
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    description: Configuration for redis-store
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- if .Values.redisStore.labels }}
      {{- toYaml .Values.redisStore.labels | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: redis
  name: {{ .Values.redisStore.name }}-conf
data:
  redis.conf: |
    {{- include "sourcegraph.redis.conf" (list . "redisStore") | nindent 4 }}
{{- end }}
{{- end }}
