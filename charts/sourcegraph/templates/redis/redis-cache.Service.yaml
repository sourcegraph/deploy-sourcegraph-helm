{{- if .Values.redisCache.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: "9121"
    sourcegraph.prometheus/scrape: "true"
    {{- if .Values.redisCache.serviceAnnotations }}
    {{- toYaml .Values.redisCache.serviceAnnotations | nindent 4 }}
    {{- end }}
  labels:
    {{- with include "sourcegraph.serviceLabels" (list . .Values.redisCache) }}
    {{- . | nindent 4 }}
    {{- end }}
    app: redis-cache
    deploy: sourcegraph
    app.kubernetes.io/component: redis
  name: redis-cache
spec:
  ports:
  - name: http-metrics
    port: 9121
    targetPort: http-metrics
  - name: redis
    port: 6379
    targetPort: redis
  {{- with .Values.redisCache.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.redisCache) | nindent 4 }}
    app: redis-cache
  type: {{ .Values.redisCache.serviceType | default "ClusterIP" }}
{{- end }}
