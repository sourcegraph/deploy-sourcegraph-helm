{{- if and (not .Values.sourcegraph.disableKubernetesSecrets) (not .Values.redisStore.connection.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . .Values.redisStore.labels (dict "app" "redis-store" "deploy" "sourcegraph" "app.kubernetes.io/component" "redis-store")) | nindent 4 }}
  name: {{ .Values.redisStore.name }}
type: Opaque
data:
  endpoint: {{ .Values.redisStore.connection.endpoint | toString | b64enc | quote }}
{{- end -}}
