{{- if and .Values.redisCache.enabled .Values.redisCache.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- if .Values.redisCache.labels }}
      {{- toYaml .Values.redisCache.labels | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: redis
  name: {{ .Values.redisCache.name }}
spec:
  {{- toYaml .Values.redisCache.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.redisCache) | nindent 6 }}
      app: redis-cache
{{- end }}
