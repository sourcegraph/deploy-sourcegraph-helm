{{- if and .Values.redisStore.enabled .Values.redisStore.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list . "redisStore") | fromYaml) (dict "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "redis")) | nindent 4 }}
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "redisStore") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "redisStore") }}
{{- end }}
