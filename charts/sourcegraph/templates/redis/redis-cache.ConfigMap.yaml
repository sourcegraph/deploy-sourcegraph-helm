{{- if and .Values.redisCache.enabled .Values.redisCache.config.enabled -}}
{{- if and .Values.redisCache.config.existingConfig .Values.redisCache.config.additionalConfig -}}
{{- fail "You can only define one of 'redisCache.config.existingConfig' and 'redisCache.config.additionalConfig' at a time" }}
{{- end }}
{{- if not .Values.redisCache.config.existingConfig -}}
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    description: Configuration for redis-cache
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- if .Values.redisCache.labels }}
      {{- toYaml .Values.redisCache.labels | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: redis
  name: {{ .Values.redisCache.name }}-conf
data:
  redis.conf: |
    {{- include "sourcegraph.redis.conf" (list . "redisCache") | nindent 4 }}
{{- end }}
{{- end }}
