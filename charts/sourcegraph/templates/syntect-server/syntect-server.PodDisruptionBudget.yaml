{{- if .Values.syntectServer.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- if .Values.syntectServer.labels }}
      {{- toYaml .Values.syntectServer.labels | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: syntect-server
  name: {{ .Values.syntectServer.name }}
spec:
  {{- toYaml .Values.syntectServer.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.syntectServer) | nindent 6 }}
      app: syntect-server
{{- end }}
