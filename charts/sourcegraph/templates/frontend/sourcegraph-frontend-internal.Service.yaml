apiVersion: v1
kind: Service
metadata:
  {{- with .Values.frontend.internalServiceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (dict "app" "sourcegraph-frontend" "deploy" "sourcegraph" "app.kubernetes.io/component" "frontend") .Values.frontend.internalServiceLabels) | nindent 4 }}
  name: sourcegraph-frontend-internal
spec:
  ports:
  - name: grpc-internal
    port: 80
    targetPort: grpc-internal
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.frontend) | nindent 4 }}
    app: sourcegraph-frontend
  type: {{ .Values.frontend.internalServiceType | default "ClusterIP" }}
