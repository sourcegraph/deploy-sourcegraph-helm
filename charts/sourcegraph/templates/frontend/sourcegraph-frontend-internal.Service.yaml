apiVersion: v1
kind: Service
metadata:
  {{- $annotations := .Values.frontend.serviceAnnotations }}
  {{- if kindIs "map" .Values.frontendInternal.serviceAnnotations }}
  {{- $annotations = .Values.frontendInternal.serviceAnnotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- $labels := .Values.frontend.serviceLabels }}
    {{- if kindIs "map" .Values.frontendInternal.serviceLabels }}
    {{- $labels = .Values.frontendInternal.serviceLabels }}
    {{- end }}
    {{- with include "sourcegraph.userLabels" (list .Values.sourcegraph.serviceLabels $labels) }}
    {{- . | nindent 4 }}
    {{- end }}
    app: sourcegraph-frontend
    deploy: sourcegraph
    app.kubernetes.io/component: frontend
  name: sourcegraph-frontend-internal
spec:
  ports:
  - name: grpc-internal
    port: 80
    targetPort: grpc-internal
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.frontend) | nindent 4 }}
    app: sourcegraph-frontend
  type: {{ .Values.frontendInternal.serviceType | default .Values.frontend.internalServiceType | default "ClusterIP" }}
