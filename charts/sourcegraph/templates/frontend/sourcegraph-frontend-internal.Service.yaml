{{- /*
Unset, the internal Service gets the annotations and labels of the
sourcegraph-frontend Service. Set, even to {}, the internal values replace them.
*/ -}}
{{- $annotations := .Values.frontend.serviceAnnotations }}
{{- if not (kindIs "invalid" .Values.frontend.internalServiceAnnotations) }}
{{- $annotations = .Values.frontend.internalServiceAnnotations }}
{{- end }}
{{- $labels := .Values.frontend.serviceLabels }}
{{- if not (kindIs "invalid" .Values.frontend.internalServiceLabels) }}
{{- $labels = .Values.frontend.internalServiceLabels }}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: sourcegraph-frontend
    deploy: sourcegraph
    app.kubernetes.io/component: frontend
    {{- with $labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: sourcegraph-frontend-internal
spec:
  ports:
  - name: grpc-internal
    port: 80
    targetPort: grpc-internal
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.frontend) | nindent 4 }}
    app: sourcegraph-frontend
  type: {{ .Values.frontend.internalServiceType | default "ClusterIP" }}
