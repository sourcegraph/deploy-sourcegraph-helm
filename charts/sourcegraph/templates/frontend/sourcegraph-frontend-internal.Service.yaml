apiVersion: v1
kind: Service
metadata:
  {{- with .Values.frontendInternal.serviceAnnotations | default .Values.frontend.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- with include "sourcegraph.userLabels" (list .Values.sourcegraph.serviceLabels (.Values.frontendInternal.serviceLabels | default .Values.frontend.serviceLabels)) }}
    {{- . | nindent 4 }}
    {{- end }}
    app: sourcegraph-frontend
    deploy: sourcegraph
    app.kubernetes.io/component: frontend
  name: sourcegraph-frontend-internal
spec:
  ports:
  - name: grpc-internal
    port: 80
    targetPort: grpc-internal
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.frontend) | nindent 4 }}
    app: sourcegraph-frontend
  type: {{ .Values.frontendInternal.serviceType | default .Values.frontend.internalServiceType | default "ClusterIP" }}
