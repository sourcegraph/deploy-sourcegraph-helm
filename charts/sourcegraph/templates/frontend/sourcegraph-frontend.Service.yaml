apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: "6060"
    sourcegraph.prometheus/scrape: "true"
    {{- if .Values.frontend.serviceAnnotations }}
    {{- toYaml .Values.frontend.serviceAnnotations | nindent 4 }}
    {{- end }}
  labels:
    {{- with include "sourcegraph.serviceLabels" (list . .Values.frontend) }}
    {{- . | nindent 4 }}
    {{- end }}
    app: sourcegraph-frontend
    deploy: sourcegraph
    app.kubernetes.io/component: frontend
  name: sourcegraph-frontend
spec:
  ports:
  - name: http
    port: 30080
    targetPort: http
  - name: http-debug
    port: 6060
    targetPort: http-debug
  {{- with .Values.frontend.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.frontend) | nindent 4 }}
    app: sourcegraph-frontend
  type: {{ .Values.frontend.serviceType | default "ClusterIP" }}
