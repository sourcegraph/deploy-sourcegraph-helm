apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      `prometheus.io/port: "6060"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.frontend.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      .Values.sourcegraph.serviceLabels
      "app: sourcegraph-frontend"
      "deploy: sourcegraph"
      "app.kubernetes.io/component: frontend"
      .Values.frontend.serviceLabels
    ) | nindent 4 }}
  name: sourcegraph-frontend
spec:
  ports:
  - name: http
    port: 30080
    targetPort: http
  - name: http-debug
    port: 6060
    targetPort: http-debug
  {{- with .Values.frontend.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.frontend) | nindent 4 }}
    app: sourcegraph-frontend
  type: {{ .Values.frontend.serviceType | default "ClusterIP" }}
