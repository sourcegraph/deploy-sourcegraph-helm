{{- if .Values.frontend.createRoleBinding }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list . "frontend") | fromYaml) (dict "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "frontend")) | nindent 4 }}
  name: {{ .Values.frontend.name }}
roleRef:
{{- if .Values.frontend.privileged }}
  apiGroup: "rbac.authorization.k8s.io"
  kind: Role
  name: {{ .Values.frontend.name }}
{{- else }}
  apiGroup: ""
  kind: ClusterRole
  name: view
{{- end }}
subjects:
- name: {{ include "sourcegraph.serviceAccountName" (list . "frontend") }}
  kind: ServiceAccount
  namespace: {{ .Release.Namespace }}
{{- end }}
