{{- if .Values.codeIntelDB.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      `prometheus.io/port: "9187"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.codeIntelDB.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      .Values.sourcegraph.serviceLabels
      "app.kubernetes.io/component: codeintel-db"
      "app: codeintel-db"
      "deploy: sourcegraph"
      .Values.codeIntelDB.serviceLabels
    ) | nindent 4 }}
  name: codeintel-db
spec:
  ports:
  - name: http-metrics
    port: 9187
    targetPort: http-metrics
  - name: pgsql
    port: 5432
    targetPort: pgsql
  {{- with .Values.codeIntelDB.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.codeIntelDB) | nindent 4 }}
    app: codeintel-db
  type: {{ .Values.codeIntelDB.serviceType | default "ClusterIP" }}
{{- end }}
