{{- if and .Values.codeIntelDB.enabled .Values.codeIntelDB.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list . "codeIntelDB") | fromYaml) (dict "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "codeintel-db")) | nindent 4 }}
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "codeIntelDB") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "codeIntelDB") }}
{{- end }}
