{{- if .Values.indexedSearch.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list . "indexedSearch") | fromYaml) (dict "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "indexed-search")) | nindent 4 }}
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "indexedSearch") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "indexedSearch") }}
{{- end }}
