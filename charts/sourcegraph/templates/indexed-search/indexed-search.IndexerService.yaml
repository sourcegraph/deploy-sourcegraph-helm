apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      "description: Headless service that provides a stable network identity for the\n  indexed-search stateful set."
      `prometheus.io/port: "6072"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.indexedSearch.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      .Values.sourcegraph.serviceLabels
      "app: indexed-search-indexer"
      "deploy: sourcegraph"
      "app.kubernetes.io/component: indexed-search"
      .Values.indexedSearch.serviceLabels
    ) | nindent 4 }}
  name: {{ default "indexed-search-indexer" .Values.indexedSearch.indexerName }}
spec:
  clusterIP: None
  ports:
  - name: grpc-indexer
    port: 6072
    targetPort: grpc-indexer
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.indexedSearch) | nindent 4 }}
    app: indexed-search
  type: {{ .Values.indexedSearch.serviceType | default "ClusterIP" }}
