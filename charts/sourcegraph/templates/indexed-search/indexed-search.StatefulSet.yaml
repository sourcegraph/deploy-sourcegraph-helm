apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    description: Backend for indexed text search operations.
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      "deploy: sourcegraph"
      "app.kubernetes.io/component: indexed-search"
      (include "sourcegraph.labels" .)
      .Values.indexedSearch.labels
    ) | nindent 4 }}
  name: {{ .Values.indexedSearch.name }}
spec:
  replicas: {{ .Values.indexedSearch.replicaCount }}
  revisionHistoryLimit: {{ .Values.sourcegraph.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.indexedSearch) | nindent 6 }}
      app: indexed-search
  serviceName: indexed-search
  template:
    metadata:
      {{- if or .Values.sourcegraph.podAnnotations .Values.indexedSearch.podAnnotations }}
      annotations:
        {{- include "sourcegraph.uniqueKeys" (list
          .Values.sourcegraph.podAnnotations
          .Values.indexedSearch.podAnnotations
        ) | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sourcegraph.uniqueKeys" (list
          (include "sourcegraph.selectorLabels" (list . .Values.indexedSearch))
          .Values.sourcegraph.podLabels
          .Values.indexedSearch.podLabels
          "app: indexed-search"
          "deploy: sourcegraph"
        ) | nindent 8 }}
    spec:
      {{- with .Values.indexedSearch.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: zoekt-webserver
        image: {{ include "sourcegraph.image" (list . "indexedSearch") }}
        imagePullPolicy: {{ .Values.sourcegraph.image.pullPolicy }}
        {{- with .Values.indexedSearch.args }}
        args:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        terminationMessagePolicy: FallbackToLogsOnError
        env:
        {{- range $name, $item := .Values.indexedSearch.env}}
        - name: {{ $name }}
          {{- $item | toYaml | nindent 10 }}
        {{- end }}
        {{- include "sourcegraph.openTelemetryEnv" . | nindent 8 }}
        {{- if .Values.openTelemetry.enabled }}
        - name: OPENTELEMETRY_DISABLED
          value: "false"
        {{- end }}
        ports:
        - name: grpc
          containerPort: 6070
        livenessProbe:
          httpGet:
            path: /healthz
            port: grpc
            scheme: HTTP
          initialDelaySeconds: {{ .Values.indexedSearch.livenessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.indexedSearch.livenessProbe.timeoutSeconds }}
          periodSeconds: {{ .Values.indexedSearch.livenessProbe.periodSeconds }}
          failureThreshold: {{ .Values.indexedSearch.livenessProbe.failureThreshold }}
        readinessProbe:
          failureThreshold: {{ .Values.indexedSearch.readinessProbe.failureThreshold }}
          httpGet:
            path: /healthz
            port: grpc
            scheme: HTTP
          periodSeconds: {{ .Values.indexedSearch.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.indexedSearch.readinessProbe.timeoutSeconds }}
        {{- if not .Values.sourcegraph.localDevMode }}
        resources:
          {{- toYaml .Values.indexedSearch.resources | nindent 10 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.indexedSearch.containerSecurityContext | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: data
          {{- if .Values.indexedSearch.storageSubPath }}
          subPath: {{ .Values.indexedSearch.storageSubPath }}
          {{- end }}
        {{- if .Values.indexedSearch.extraVolumeMounts }}
        {{- toYaml .Values.indexedSearch.extraVolumeMounts | nindent 8 }}
        {{- end }}
      - name: zoekt-indexserver
        image: {{ include "sourcegraph.image" (list . "indexedSearchIndexer") }}
        imagePullPolicy: {{ .Values.sourcegraph.image.pullPolicy }}
        terminationMessagePolicy: FallbackToLogsOnError
        env:
        {{- range $name, $item := .Values.indexedSearchIndexer.env}}
        - name: {{ $name }}
          {{- $item | toYaml | nindent 10 }}
        {{- end }}
        {{- include "sourcegraph.openTelemetryEnv" . | nindent 8 }}
        {{- if .Values.openTelemetry.enabled }}
        - name: OPENTELEMETRY_DISABLED
          value: "false"
        {{- end }}
        ports:
        - name: grpc-indexer
          containerPort: 6072
        {{- if not .Values.sourcegraph.localDevMode }}
        resources:
          {{- toYaml .Values.indexedSearchIndexer.resources | nindent 10 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.indexedSearchIndexer.containerSecurityContext | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: data
          {{- if .Values.indexedSearch.storageSubPath }}
          subPath: {{ .Values.indexedSearch.storageSubPath }}
          {{- end }}
        {{- if .Values.indexedSearchIndexer.extraVolumeMounts }}
        {{- toYaml .Values.indexedSearchIndexer.extraVolumeMounts | nindent 8 }}
        {{- end }}
      {{- if .Values.indexedSearch.extraContainers }}
        {{- toYaml .Values.indexedSearch.extraContainers | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.indexedSearch.podSecurityContext | nindent 8 }}
      {{- include "sourcegraph.nodeSelector" (list . "indexedSearch" ) | trim | nindent 6 }}
      {{- include "sourcegraph.affinity" (list . "indexedSearch" ) | trim | nindent 6 }}
      {{- with include "sourcegraph.priorityClassName" (list . "indexedSearch" ) | trim }}{{ . | nindent 6 }}{{- end }}
      {{- include "sourcegraph.tolerations" (list . "indexedSearch" ) | trim | nindent 6 }}
      {{- with .Values.sourcegraph.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "sourcegraph.renderServiceAccountName" (list . "indexedSearch") | trim | nindent 6 }}
      volumes:
      - name: data
      {{- if .Values.indexedSearch.extraVolumes }}
      {{- toYaml .Values.indexedSearch.extraVolumes | nindent 6 }}
      {{- end }}
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      labels:
        {{- include "sourcegraph.uniqueKeys" (list
          "deploy: sourcegraph"
          .Values.indexedSearch.storageLabels
        ) | nindent 8 }}
      name: data
      {{- if .Values.indexedSearch.storageAnnotations }}
      annotations:
        {{- toYaml .Values.indexedSearch.storageAnnotations | nindent 8 }}
      {{- end }}
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.indexedSearch.storageSize }}
      storageClassName: {{ .Values.storageClass.name }}
