{{- if .Values.indexedSearch.continuity.enabled -}}
{{- $indexer := .Values.indexedSearch.continuity.indexer -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    description: Exposes the indexed search continuity indexers' metrics to Prometheus.
    prometheus.io/port: "6060"
    sourcegraph.prometheus/scrape: "true"
  labels:
    app: {{ $indexer.name }}
    deploy: sourcegraph
    app.kubernetes.io/component: indexed-search-indexer
  name: {{ $indexer.name }}
spec:
  clusterIP: None
  ports:
  - name: http-debug
    port: 6060
    targetPort: http-debug
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.indexedSearch) | nindent 4 }}
    app: indexed-search-indexer
{{- end }}
