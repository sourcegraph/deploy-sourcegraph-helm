{{- if .Values.indexedSearch.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- if .Values.indexedSearch.labels }}
      {{- toYaml .Values.indexedSearch.labels | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: indexed-search
  name: {{ .Values.indexedSearch.name }}
spec:
  {{- toYaml .Values.indexedSearch.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.indexedSearch) | nindent 6 }}
      app: indexed-search
{{- end }}
