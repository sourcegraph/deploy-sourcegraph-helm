{{- if and .Values.indexedSearch.continuity.enabled .Values.indexedSearcher.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    category: rbac
    deploy: sourcegraph
    app.kubernetes.io/component: indexed-searcher
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "indexedSearcher") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "indexedSearcher") }}
{{- end }}
