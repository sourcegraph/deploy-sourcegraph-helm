{{- if .Values.indexedSearch.continuity.enabled -}}
{{- include "sourcegraph.indexedSearchContinuity.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    description: Serves indexed search continuity generations that the indexers publish through object storage.
  labels:
    deploy: sourcegraph
    app.kubernetes.io/component: indexed-searcher
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- if .Values.indexedSearcher.labels }}
      {{- toYaml .Values.indexedSearcher.labels | nindent 4 }}
    {{- end }}
  name: {{ .Values.indexedSearcher.name }}
spec:
  replicas: {{ .Values.indexedSearcher.replicaCount }}
  revisionHistoryLimit: {{ .Values.sourcegraph.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.indexedSearcher) | nindent 6 }}
      app: indexed-searcher
  serviceName: indexed-searcher
  podManagementPolicy: OrderedReady
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: zoekt-continuity-webserver
        {{- if .Values.sourcegraph.podAnnotations }}
        {{- toYaml .Values.sourcegraph.podAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.indexedSearcher.podAnnotations }}
        {{- toYaml .Values.indexedSearcher.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.indexedSearcher) | nindent 8 }}
      {{- if .Values.sourcegraph.podLabels }}
      {{- toYaml .Values.sourcegraph.podLabels | nindent 8 }}
      {{- end }}
      {{- if .Values.indexedSearcher.podLabels }}
      {{- toYaml .Values.indexedSearcher.podLabels | nindent 8 }}
      {{- end }}
        app: indexed-searcher
        deploy: sourcegraph
    spec:
      {{- include "sourcegraph.terminationGracePeriodSeconds" (list . "indexedSearcher") | nindent 6 }}
      {{- with .Values.indexedSearcher.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: zoekt-continuity-webserver
        image: {{ include "sourcegraph.indexedSearchContinuity.image" (list . .Values.indexedSearcher.image) }}
        imagePullPolicy: {{ .Values.sourcegraph.image.pullPolicy }}
        {{- with .Values.indexedSearcher.command }}
        command:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.indexedSearcher.args }}
        args:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        terminationMessagePolicy: FallbackToLogsOnError
        env:
        {{- range $name, $item := .Values.indexedSearcher.env }}
        - name: {{ $name }}
          {{- $item | toYaml | nindent 10 }}
        {{- end }}
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DATA_DIR
          value: /data/index
        - name: SRC_FRONTEND_INTERNAL
          value: sourcegraph-frontend-internal
        {{- if not .Values.sourcegraph.disableKubernetesSecrets }}
        {{- include "sourcegraph.databaseAuth" (list . "pgsql" "PG") | nindent 8 }}
        {{- end }}
        {{- include "sourcegraph.redisConnection" . | nindent 8 }}
        {{- include "sourcegraph.indexedSearchContinuity.env" . | nindent 8 }}
        {{- include "sourcegraph.openTelemetryEnv" . | nindent 8 }}
        {{- if .Values.openTelemetry.enabled }}
        - name: OPENTELEMETRY_DISABLED
          value: "false"
        {{- end }}
        ports:
        - name: grpc
          containerPort: 6070
        - name: http-debug
          containerPort: 6060
        livenessProbe:
          httpGet:
            path: /healthz
            port: grpc
            scheme: HTTP
          initialDelaySeconds: {{ .Values.indexedSearcher.livenessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.indexedSearcher.livenessProbe.timeoutSeconds }}
          periodSeconds: {{ .Values.indexedSearcher.livenessProbe.periodSeconds }}
          failureThreshold: {{ .Values.indexedSearcher.livenessProbe.failureThreshold }}
        readinessProbe:
          failureThreshold: {{ .Values.indexedSearcher.readinessProbe.failureThreshold }}
          httpGet:
            path: /ready
            port: grpc
            scheme: HTTP
          periodSeconds: {{ .Values.indexedSearcher.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.indexedSearcher.readinessProbe.timeoutSeconds }}
        {{- if not .Values.sourcegraph.localDevMode }}
        resources:
          {{- toYaml .Values.indexedSearcher.resources | nindent 10 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.indexedSearcher.containerSecurityContext | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: data
          {{- if .Values.indexedSearcher.storageSubPath }}
          subPath: {{ .Values.indexedSearcher.storageSubPath }}
          {{- end }}
        {{- if .Values.indexedSearcher.extraVolumeMounts }}
        {{- toYaml .Values.indexedSearcher.extraVolumeMounts | nindent 8 }}
        {{- end }}
      {{- if .Values.indexedSearcher.extraContainers }}
        {{- toYaml .Values.indexedSearcher.extraContainers | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.indexedSearcher.podSecurityContext | nindent 8 }}
      {{- include "sourcegraph.nodeSelector" (list . "indexedSearcher" ) | trim | nindent 6 }}
      {{- include "sourcegraph.affinity" (list . "indexedSearcher" ) | trim | nindent 6 }}
      {{- with include "sourcegraph.priorityClassName" (list . "indexedSearcher" ) | trim }}{{ . | nindent 6 }}{{- end }}
      {{- include "sourcegraph.tolerations" (list . "indexedSearcher" ) | trim | nindent 6 }}
      {{- with .Values.sourcegraph.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "sourcegraph.renderServiceAccountName" (list . "indexedSearcher") | trim | nindent 6 }}
      volumes:
      - name: data
      {{- if .Values.indexedSearcher.extraVolumes }}
      {{- toYaml .Values.indexedSearcher.extraVolumes | nindent 6 }}
      {{- end }}
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      labels:
        deploy: sourcegraph
        {{- with .Values.indexedSearcher.storageLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      name: data
      {{- if .Values.indexedSearcher.storageAnnotations }}
      annotations:
        {{- toYaml .Values.indexedSearcher.storageAnnotations | nindent 8 }}
      {{- end }}
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.indexedSearcher.storageSize }}
      storageClassName: {{ default .Values.storageClass.name .Values.indexedSearcher.storageClassName }}
{{- end }}
