{{- if .Values.indexedSearch.continuity.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    description: Headless service that provides a stable network identity for the
      indexed-searcher stateful set.
    # Continuity webservers serve metrics on their debug port.
    prometheus.io/port: "6060"
    sourcegraph.prometheus/scrape: "true"
    {{- if .Values.indexedSearcher.serviceAnnotations }}
    {{- toYaml .Values.indexedSearcher.serviceAnnotations | nindent 4 }}
    {{- end }}
  labels:
    app: indexed-searcher
    deploy: sourcegraph
    app.kubernetes.io/component: indexed-searcher
    {{- if .Values.indexedSearcher.serviceLabels }}
      {{- toYaml .Values.indexedSearcher.serviceLabels | nindent 4 }}
    {{- end }}
  name: indexed-searcher
spec:
  clusterIP: None
  # A starting webserver reports not ready until it has loaded all its slots,
  # so a rolling restart waits for it. Meanwhile the frontend already routes
  # the slots it reports ready, which needs its DNS name to resolve.
  publishNotReadyAddresses: true
  ports:
  - name: grpc
    port: 6070
    targetPort: grpc
  {{- with .Values.indexedSearcher.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.indexedSearcher) | nindent 4 }}
    app: indexed-searcher
  type: {{ .Values.indexedSearcher.serviceType | default "ClusterIP" }}
{{- end }}
