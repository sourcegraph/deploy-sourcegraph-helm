{{- if and .Values.indexedSearch.continuity.enabled .Values.indexedSearcher.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.indexedSearcher.name }}
spec:
  {{- toYaml .Values.indexedSearcher.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.indexedSearcher) | nindent 6 }}
      app: indexed-searcher
{{- end }}
