{{- if .Values.indexedSearch.continuity.enabled -}}
{{- $indexer := .Values.indexedSearch.continuity.indexer -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Builds indexed search shards and publishes them through object storage for continuity webservers.
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- if .Values.indexedSearcher.labels }}
      {{- toYaml .Values.indexedSearcher.labels | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: indexed-searcher-indexer
  name: {{ $indexer.name }}
spec:
  replicas: {{ $indexer.replicaCount }}
  revisionHistoryLimit: {{ .Values.sourcegraph.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.indexedSearcher) | nindent 6 }}
      app: indexed-searcher-indexer
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: zoekt-continuity-indexer
      {{- if .Values.sourcegraph.podAnnotations }}
      {{- toYaml .Values.sourcegraph.podAnnotations | nindent 8 }}
      {{- end }}
      {{- if .Values.indexedSearcher.podAnnotations }}
      {{- toYaml .Values.indexedSearcher.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.indexedSearcher) | nindent 8 }}
      {{- if .Values.sourcegraph.podLabels }}
      {{- toYaml .Values.sourcegraph.podLabels | nindent 8 }}
      {{- end }}
        app: indexed-searcher-indexer
        deploy: sourcegraph
    spec:
      terminationGracePeriodSeconds: {{ .Values.sourcegraph.terminationGracePeriodSeconds }}
      containers:
      - name: zoekt-continuity-indexer
        image: {{ include "sourcegraph.indexedSearchContinuity.image" (list . .Values.indexedSearch.continuity.indexerImage) }}
        imagePullPolicy: {{ .Values.sourcegraph.image.pullPolicy }}
        {{- with $indexer.command }}
        command:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $indexer.args }}
        args:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        terminationMessagePolicy: FallbackToLogsOnError
        env:
        {{- range $name, $item := $indexer.env }}
        - name: {{ $name }}
          {{- $item | toYaml | nindent 10 }}
        {{- end }}
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DATA_DIR
          value: /data
        - name: TMPDIR
          value: /data
        - name: HOME
          value: /data
        - name: SRC_FRONTEND_INTERNAL
          value: sourcegraph-frontend-internal
        {{- if not .Values.sourcegraph.disableKubernetesSecrets }}
        {{- include "sourcegraph.databaseAuth" (list . "pgsql" "PG") | nindent 8 }}
        {{- end }}
        {{- include "sourcegraph.redisConnection" . | nindent 8 }}
        {{- include "sourcegraph.indexedSearchContinuity.env" . | nindent 8 }}
        {{- include "sourcegraph.openTelemetryEnv" . | nindent 8 }}
        {{- if .Values.openTelemetry.enabled }}
        - name: OPENTELEMETRY_DISABLED
          value: "false"
        {{- end }}
        ports:
        - name: http-debug
          containerPort: 6060
        {{- if not .Values.sourcegraph.localDevMode }}
        resources:
          {{- toYaml $indexer.resources | nindent 10 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.indexedSearcher.containerSecurityContext | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: scratch
      securityContext:
        {{- toYaml .Values.indexedSearcher.podSecurityContext | nindent 8 }}
      {{- include "sourcegraph.nodeSelector" (list . "indexedSearcher" ) | trim | nindent 6 }}
      {{- include "sourcegraph.affinity" (list . "indexedSearcher" ) | trim | nindent 6 }}
      {{- with include "sourcegraph.priorityClassName" (list . "indexedSearcher" ) | trim }}{{ . | nindent 6 }}{{- end }}
      {{- include "sourcegraph.tolerations" (list . "indexedSearcher" ) | trim | nindent 6 }}
      {{- with .Values.sourcegraph.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "sourcegraph.renderServiceAccountName" (list . "indexedSearcher") | trim | nindent 6 }}
      volumes:
      - name: scratch
        emptyDir:
          sizeLimit: {{ $indexer.scratchSizeLimit }}
{{- end }}
