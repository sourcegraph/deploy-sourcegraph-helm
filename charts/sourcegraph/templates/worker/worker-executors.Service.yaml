apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      `prometheus.io/port: "6996"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.worker.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      "app: worker"
      "deploy: sourcegraph"
      "app.kubernetes.io/component: worker"
      .Values.worker.serviceLabels
    ) | nindent 4 }}
  name: worker-executors
spec:
  ports:
  - name: http-debug-exec
    port: 6996
    targetPort: http-debug-exec
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.worker) | nindent 4 }}
    app: worker
  type: {{ .Values.worker.serviceType | default "ClusterIP" }}
