{{- if .Values.worker.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list . "worker") | fromYaml) (dict "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "worker")) | nindent 4 }}
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "worker") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "worker") }}
{{- end }}
