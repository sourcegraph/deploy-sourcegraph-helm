{{- if .Values.zoekt.enabled -}}
{{- $indexer := .Values.zoekt.indexer -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    description: Exposes the the Zoekt indexer and searchers indexers' metrics to Prometheus.
    prometheus.io/port: "6060"
    sourcegraph.prometheus/scrape: "true"
  labels:
    app: {{ $indexer.name }}
    deploy: sourcegraph
    app.kubernetes.io/component: zoekt-indexer
  name: {{ $indexer.name }}
spec:
  clusterIP: None
  ports:
  - name: http-debug
    port: 6060
    targetPort: http-debug
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.zoektSearcher) | nindent 4 }}
    app: zoekt-indexer
{{- end }}
