{{- if and .Values.zoekt.enabled .Values.zoektSearcher.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    category: rbac
    deploy: sourcegraph
    app.kubernetes.io/component: zoekt-searcher
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "zoektSearcher") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "zoektSearcher") }}
{{- end }}
