{{- if .Values.prometheus.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . .Values.prometheus.storageLabels (dict "deploy" "sourcegraph" "app.kubernetes.io/component" "prometheus")) | nindent 4 }}
  {{- if .Values.prometheus.storageAnnotations }}
  annotations:
    {{- toYaml .Values.prometheus.storageAnnotations | nindent 4 }}
  {{- end }}
  name: prometheus
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.prometheus.storageSize }}
  storageClassName: {{ .Values.storageClass.name }}
  {{- if .Values.prometheus.volumeName }}
  volumeName: {{ .Values.prometheus.volumeName }}
  {{- end }}
{{- end }}
