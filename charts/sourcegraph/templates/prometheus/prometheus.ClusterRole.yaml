{{- if and .Values.prometheus.enabled .Values.prometheus.privileged -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- with include "sourcegraph.serviceAccountLabels" (list . "prometheus") }}
    {{- . | nindent 4 }}
    {{- end }}
    category: rbac
    deploy: sourcegraph
    app.kubernetes.io/component: prometheus
  name: {{ .Values.prometheus.name }}
rules:
- apiGroups:
  - ""
  resources:
  - endpoints
  - namespaces
  - nodes
  - nodes/metrics
  - nodes/proxy
  - pods
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
- nonResourceURLs:
  - /metrics
  verbs:
  - get
{{- end }}
