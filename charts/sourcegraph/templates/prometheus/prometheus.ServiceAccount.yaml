{{- if and .Values.prometheus.enabled .Values.prometheus.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list . "prometheus") | fromYaml) (dict "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "prometheus")) | nindent 4 }}
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "prometheus") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "prometheus") }}
{{- end }}
