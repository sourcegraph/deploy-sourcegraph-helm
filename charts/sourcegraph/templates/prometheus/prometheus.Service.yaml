{{- if .Values.prometheus.enabled -}}
apiVersion: v1
kind: Service
metadata:
  {{- if .Values.prometheus.serviceAnnotations }}
  annotations:
    {{- toYaml .Values.prometheus.serviceAnnotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      "app: prometheus"
      "deploy: sourcegraph"
      "app.kubernetes.io/component: prometheus"
      .Values.prometheus.serviceLabels
    ) | nindent 4 }}
  name: prometheus
spec:
  ports:
  - name: http
    port: 30090
    targetPort: http
  {{- with .Values.prometheus.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.prometheus) | nindent 4 }}
    app: prometheus
  type: {{ .Values.prometheus.serviceType | default "ClusterIP" }}
{{- end }}
