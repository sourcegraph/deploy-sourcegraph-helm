{{- if .Values.nodeExporter.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      "description: Prometheus exporter for hardware and OS metrics."
      `prometheus.io/port: "9100"`
      `sourcegraph.prometheus/scrape: "true"`
      "url: https://github.com/prometheus/node_exporter"
      .Values.nodeExporter.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      .Values.sourcegraph.serviceLabels
      "app.kubernetes.io/component: node-exporter"
      "app: node-exporter"
      "deploy: sourcegraph"
      "sourcegraph-resource-requires: no-cluster-admin"
      .Values.nodeExporter.serviceLabels
    ) | nindent 4 }}
  name: node-exporter
spec:
  ports:
  - name: metrics
    port: 9100
    targetPort: metrics
  {{- with .Values.nodeExporter.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.nodeExporter) | nindent 4 }}
    app: node-exporter
  type: {{ .Values.nodeExporter.serviceType | default "ClusterIP" }}
{{- end }}
