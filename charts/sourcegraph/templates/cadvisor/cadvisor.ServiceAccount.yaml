{{- if and .Values.cadvisor.enabled .Values.cadvisor.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list . "cadvisor") | fromYaml) (dict "app" "cadvisor" "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "cadvisor")) | nindent 4 }}
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "cadvisor") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "cadvisor") }}
{{- end }}
