apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      "description: Headless service that provides a stable network identity for the\n  gitserver stateful set."
      `prometheus.io/port: "6060"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.gitserver.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      "deploy: sourcegraph"
      "app.kubernetes.io/component: gitserver"
      "type: gitserver"
      "app: gitserver"
      .Values.gitserver.serviceLabels
    ) | nindent 4 }}
  name: gitserver
spec:
  clusterIP: None
  ports:
  - name: grpc
    port: 3178
    targetPort: grpc
  - name: http-clone
    port: 3179
    targetPort: http-clone
  - name: http-debug
    port: 6060
    targetPort: http-debug
  {{- with .Values.gitserver.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.gitserver) | nindent 4 }}
    app: gitserver
    type: gitserver
  type: {{ .Values.gitserver.serviceType | default "ClusterIP" }}
