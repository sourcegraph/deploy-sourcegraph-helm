{{- if .Values.gitserver.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . (include "sourcegraph.serviceAccountLabels" (list . "gitserver") | fromYaml) (dict "category" "rbac" "deploy" "sourcegraph" "app.kubernetes.io/component" "gitserver")) | nindent 4 }}
  {{- include "sourcegraph.serviceAccountAnnotations" (list . "gitserver") | trim | nindent 2 }}
  name: {{ include "sourcegraph.serviceAccountName" (list . "gitserver") }}
{{- end }}
