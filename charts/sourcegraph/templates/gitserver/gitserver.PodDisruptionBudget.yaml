{{- if .Values.gitserver.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . .Values.gitserver.labels (dict "deploy" "sourcegraph" "app.kubernetes.io/component" "gitserver")) | nindent 4 }}
  name: {{ .Values.gitserver.name }}
spec:
  {{- toYaml .Values.gitserver.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.gitserver) | nindent 6 }}
      app: gitserver
{{- end }}
