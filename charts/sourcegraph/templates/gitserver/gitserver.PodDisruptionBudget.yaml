{{- if .Values.gitserver.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "sourcegraph.labels" . | nindent 4 }}
    {{- if .Values.gitserver.labels }}
      {{- toYaml .Values.gitserver.labels | nindent 4 }}
    {{- end }}
    deploy: sourcegraph
    app.kubernetes.io/component: gitserver
  name: {{ .Values.gitserver.name }}
spec:
  {{- toYaml .Values.gitserver.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
      {{- include "sourcegraph.selectorLabels" (list . .Values.gitserver) | nindent 6 }}
      app: gitserver
{{- end }}
