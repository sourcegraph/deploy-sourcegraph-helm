{{- if .Values.blobstore.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- if .Values.blobstore.serviceAnnotations }}
    {{- toYaml .Values.blobstore.serviceAnnotations | nindent 4 }}
    {{- end }}
  labels:
    {{- with include "sourcegraph.serviceLabels" (list . .Values.blobstore) }}
    {{- . | nindent 4 }}
    {{- end }}
    app: blobstore
    deploy: sourcegraph
    app.kubernetes.io/component: blobstore
  name: blobstore
spec:
  ports:
  - name: http
    port: 9000
    targetPort: http
  {{- with .Values.blobstore.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.blobstore) | nindent 4 }}
    app: blobstore
  type: {{ .Values.blobstore.serviceType | default "ClusterIP" }}
{{- end }}
