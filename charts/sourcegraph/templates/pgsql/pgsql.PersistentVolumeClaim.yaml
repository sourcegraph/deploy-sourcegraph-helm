{{- if .Values.pgsql.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    {{- include "sourcegraph.mergedLabels" (list . .Values.pgsql.storageLabels (dict "deploy" "sourcegraph" "app.kubernetes.io/component" "pgsql")) | nindent 4 }}
  {{- if .Values.pgsql.storageAnnotations }}
  annotations:
    {{- toYaml .Values.pgsql.storageAnnotations | nindent 4 }}
  {{- end }}
  name: pgsql
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pgsql.storageSize }}
  storageClassName: {{ .Values.storageClass.name }}
  {{- if .Values.pgsql.volumeName }}
  volumeName: {{ .Values.pgsql.volumeName }}
  {{- end }}
{{- end }}
