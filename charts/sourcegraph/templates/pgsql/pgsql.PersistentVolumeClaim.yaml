{{- if .Values.pgsql.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      .Values.sourcegraph.labels
      "deploy: sourcegraph"
      "app.kubernetes.io/component: pgsql"
    ) | nindent 4 }}
  {{- if .Values.pgsql.storageAnnotations }}
  annotations:
    {{- toYaml .Values.pgsql.storageAnnotations | nindent 4 }}
  {{- end }}
  name: pgsql
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pgsql.storageSize }}
  storageClassName: {{ .Values.storageClass.name }}
  {{- if .Values.pgsql.volumeName }}
  volumeName: {{ .Values.pgsql.volumeName }}
  {{- end }}
{{- end }}
