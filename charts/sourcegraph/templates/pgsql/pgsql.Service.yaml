{{- if .Values.pgsql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- include "sourcegraph.uniqueKeys" (list
      `prometheus.io/port: "9187"`
      `sourcegraph.prometheus/scrape: "true"`
      .Values.pgsql.serviceAnnotations
    ) | nindent 4 }}
  labels:
    {{- include "sourcegraph.uniqueKeys" (list
      "app: pgsql"
      "deploy: sourcegraph"
      "app.kubernetes.io/component: pgsql"
      .Values.pgsql.serviceLabels
    ) | nindent 4 }}
  name: pgsql
spec:
  ports:
  - name: http-metrics
    port: 9187
    targetPort: http-metrics
  - name: pgsql
    port: 5432
    targetPort: pgsql
  {{- with .Values.pgsql.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.pgsql) | nindent 4 }}
    app: pgsql
  type: {{ .Values.pgsql.serviceType | default "ClusterIP" }}
{{- end }}
