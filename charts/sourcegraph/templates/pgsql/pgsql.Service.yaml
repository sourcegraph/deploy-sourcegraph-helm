{{- if .Values.pgsql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: "9187"
    sourcegraph.prometheus/scrape: "true"
    {{- if .Values.pgsql.serviceAnnotations }}
    {{- toYaml .Values.pgsql.serviceAnnotations | nindent 4 }}
    {{- end }}
  labels:
    {{- with include "sourcegraph.serviceLabels" (list . .Values.pgsql) }}
    {{- . | nindent 4 }}
    {{- end }}
    app: pgsql
    deploy: sourcegraph
    app.kubernetes.io/component: pgsql
  name: pgsql
spec:
  ports:
  - name: http-metrics
    port: 9187
    targetPort: http-metrics
  - name: pgsql
    port: 5432
    targetPort: pgsql
  {{- with .Values.pgsql.extraServicePorts }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  selector:
    {{- include "sourcegraph.selectorLabels" (list . .Values.pgsql) | nindent 4 }}
    app: pgsql
  type: {{ .Values.pgsql.serviceType | default "ClusterIP" }}
{{- end }}
