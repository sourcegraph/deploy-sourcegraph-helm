suite: indexedSearchLivenessProbe
release:
  name: sourcegraph
  namespace: sourcegraph
templates:
- indexed-search/indexed-search.StatefulSet.yaml
tests:
- it: should use the default liveness probe tuning
  asserts:
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.failureThreshold
      value: 10
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
      value: 120
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.periodSeconds
      value: 60
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
      value: 5
- it: should allow overriding liveness probe tuning
  set:
    indexedSearch:
      livenessProbe:
        failureThreshold: 20
        initialDelaySeconds: 300
        periodSeconds: 30
        timeoutSeconds: 15
  asserts:
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.failureThreshold
      value: 20
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
      value: 300
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.periodSeconds
      value: 30
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
      value: 15
- it: should leave the readiness probe untouched when liveness is overridden
  set:
    indexedSearch:
      livenessProbe:
        failureThreshold: 20
  asserts:
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.failureThreshold
      value: 3
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.periodSeconds
      value: 5
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
      value: 5
- it: should keep the liveness probe target and scheme unchanged
  asserts:
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.httpGet.path
      value: /healthz
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.httpGet.port
      value: grpc
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
      value: HTTP
