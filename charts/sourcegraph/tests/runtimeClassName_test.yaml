suite: runtimeClassName
release:
  name: sourcegraph
  namespace: sourcegraph
set:
  jaeger:
    enabled: true
  syntacticCodeIntel:
    enabled: true
tests:
- it: should not set runtimeClassName by default
  templates: &workloads
  - blobstore/blobstore.Deployment.yaml
  - cadvisor/cadvisor.DaemonSet.yaml
  - codeinsights-db/codeinsights-db.StatefulSet.yaml
  - codeintel-db/codeintel-db.StatefulSet.yaml
  - frontend/sourcegraph-frontend.Deployment.yaml
  - gitserver/gitserver.StatefulSet.yaml
  - grafana/grafana.StatefulSet.yaml
  - indexed-search/indexed-search.StatefulSet.yaml
  - jaeger/jaeger.Deployment.yaml
  - node-exporter/node-exporter.DaemonSet.yaml
  - otel-collector/otel-agent.DaemonSet.yaml
  - otel-collector/otel-collector.Deployment.yaml
  - pgsql/pgsql.StatefulSet.yaml
  - precise-code-intel/worker.Deployment.yaml
  - prometheus/prometheus.Deployment.yaml
  - redis/redis-cache.Deployment.yaml
  - redis/redis-store.Deployment.yaml
  - searcher/searcher.StatefulSet.yaml
  - syntactic-code-intel/worker.Deployment.yaml
  - syntect-server/syntect-server.Deployment.yaml
  - worker/worker.Deployment.yaml
  asserts:
  - notExists:
      path: spec.template.spec.runtimeClassName

- it: should set the global runtimeClassName on every workload
  templates: *workloads
  set:
    sourcegraph:
      runtimeClassName: global-class
  asserts:
  - equal:
      path: spec.template.spec.runtimeClassName
      value: global-class

- it: should set the global runtimeClassName on the test connection pod
  template: tests/test-connection.yaml
  set:
    sourcegraph:
      runtimeClassName: global-class
  asserts:
  - equal:
      path: spec.runtimeClassName
      value: global-class

- it: should prefer a service runtimeClassName over the global one
  template: gitserver/gitserver.StatefulSet.yaml
  set:
    sourcegraph:
      runtimeClassName: global-class
    gitserver:
      runtimeClassName: gitserver-class
  asserts:
  - equal:
      path: spec.template.spec.runtimeClassName
      value: gitserver-class

- it: should opt a service out of the global runtimeClassName when its own is empty
  template: cadvisor/cadvisor.DaemonSet.yaml
  set:
    sourcegraph:
      runtimeClassName: global-class
    cadvisor:
      runtimeClassName: ""
  asserts:
  - notExists:
      path: spec.template.spec.runtimeClassName
