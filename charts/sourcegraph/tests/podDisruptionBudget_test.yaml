suite: podDisruptionBudget
release:
  name: sourcegraph
  namespace: sourcegraph
tests:
- it: should not render podDisruptionBudget for searcher by default
  template: searcher/searcher.PodDisruptionBudget.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: should not render podDisruptionBudget for syntax highlighter by default
  template: syntect-server/syntect-server.PodDisruptionBudget.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: should render podDisruptionBudget for frontend
  template: frontend/sourcegraph-frontend.PodDisruptionBudget.yaml
  set:
    frontend:
      podDisruptionBudget:
        minAvailable: 1
  asserts:
  - equal:
      path: spec.minAvailable
      value: 1
  - equal:
      path: spec.selector.matchLabels.app
      value: sourcegraph-frontend
- it: should render podDisruptionBudget for searcher
  template: searcher/searcher.PodDisruptionBudget.yaml
  set:
    searcher:
      podDisruptionBudget:
        maxUnavailable: 1
  asserts:
  - equal:
      path: apiVersion
      value: policy/v1
  - equal:
      path: metadata.name
      value: searcher
  - equal:
      path: spec.maxUnavailable
      value: 1
  - equal:
      path: spec.selector.matchLabels.app
      value: searcher
  - equal:
      path: spec.selector.matchLabels["app.kubernetes.io/name"]
      value: sourcegraph
  - equal:
      path: spec.selector.matchLabels["app.kubernetes.io/instance"]
      value: sourcegraph
- it: should render podDisruptionBudget for syntax highlighter
  template: syntect-server/syntect-server.PodDisruptionBudget.yaml
  set:
    syntectServer:
      podDisruptionBudget:
        maxUnavailable: 1
  asserts:
  - equal:
      path: apiVersion
      value: policy/v1
  - equal:
      path: metadata.name
      value: syntect-server
  - equal:
      path: spec.maxUnavailable
      value: 1
  - equal:
      path: spec.selector.matchLabels.app
      value: syntect-server
  - equal:
      path: spec.selector.matchLabels["app.kubernetes.io/name"]
      value: sourcegraph
  - equal:
      path: spec.selector.matchLabels["app.kubernetes.io/instance"]
      value: sourcegraph
- it: should render podDisruptionBudget for gitserver
  template: gitserver/gitserver.PodDisruptionBudget.yaml
  set:
    gitserver.podDisruptionBudget.minAvailable: 1
  asserts:
  - equal:
      path: metadata.name
      value: gitserver
  - equal:
      path: spec.minAvailable
      value: 1
  - equal:
      path: spec.selector.matchLabels.app
      value: gitserver
- it: should render podDisruptionBudget for indexed search
  template: indexed-search/indexed-search.PodDisruptionBudget.yaml
  set:
    indexedSearch.podDisruptionBudget.maxUnavailable: 1
  asserts:
  - equal:
      path: metadata.name
      value: indexed-search
  - equal:
      path: spec.maxUnavailable
      value: 1
  - equal:
      path: spec.selector.matchLabels.app
      value: indexed-search
- it: should render podDisruptionBudget for precise code intel
  template: precise-code-intel/worker.PodDisruptionBudget.yaml
  set:
    preciseCodeIntel.podDisruptionBudget.maxUnavailable: 1
  asserts:
  - equal:
      path: metadata.name
      value: precise-code-intel-worker
  - equal:
      path: spec.maxUnavailable
      value: 1
  - equal:
      path: spec.selector.matchLabels.app
      value: precise-code-intel-worker
- it: should render podDisruptionBudget for redis cache
  template: redis/redis-cache.PodDisruptionBudget.yaml
  set:
    redisCache.podDisruptionBudget.minAvailable: 1
  asserts:
  - equal:
      path: metadata.name
      value: redis-cache
  - equal:
      path: spec.minAvailable
      value: 1
  - equal:
      path: spec.selector.matchLabels.app
      value: redis-cache
- it: should render podDisruptionBudget for redis store
  template: redis/redis-store.PodDisruptionBudget.yaml
  set:
    redisStore.podDisruptionBudget.minAvailable: 1
  asserts:
  - equal:
      path: metadata.name
      value: redis-store
  - equal:
      path: spec.minAvailable
      value: 1
  - equal:
      path: spec.selector.matchLabels.app
      value: redis-store
- it: should render podDisruptionBudget for syntactic code intel when enabled
  template: syntactic-code-intel/worker.PodDisruptionBudget.yaml
  set:
    syntacticCodeIntel.enabled: true
    syntacticCodeIntel.podDisruptionBudget.maxUnavailable: 1
  asserts:
  - equal:
      path: metadata.name
      value: syntactic-code-intel-worker
  - equal:
      path: spec.maxUnavailable
      value: 1
  - equal:
      path: spec.selector.matchLabels.app
      value: syntactic-code-intel-worker
- it: should render a podDisruptionBudget for every worker deployment
  template: worker/worker.PodDisruptionBudget.yaml
  set:
    worker:
      podDisruptionBudget:
        maxUnavailable: 1
      replicas:
      - jobs: ["job1"]
      - jobs: ["job2"]
  asserts:
  - hasDocuments:
      count: 3
  - equal:
      path: metadata.name
      value: worker
    documentIndex: 0
  - notExists:
      path: spec.selector.matchLabels.worker-replica
    documentIndex: 0
  - equal:
      path: spec.selector.matchExpressions[0]
      value:
        key: worker-replica
        operator: DoesNotExist
    documentIndex: 0
  - equal:
      path: metadata.name
      value: worker-0
    documentIndex: 1
  - equal:
      path: spec.selector.matchLabels.worker-replica
      value: worker-0
    documentIndex: 1
  - equal:
      path: metadata.name
      value: worker-1
    documentIndex: 2
  - equal:
      path: spec.selector.matchLabels.worker-replica
      value: worker-1
    documentIndex: 2
