suite: prometheusPrivileged
release:
  name: sourcegraph
  namespace: sourcegraph-test
templates:
  - prometheus/prometheus.ClusterRole.yaml
  - prometheus/prometheus.ClusterRoleBinding.yaml
  - prometheus/prometheus.RoleBinding.yaml
  - prometheus/prometheus.ConfigMap.yaml
tests:
  - it: should create only a RoleBinding to the view ClusterRole by default
    asserts:
      - hasDocuments:
          count: 0
        template: prometheus/prometheus.ClusterRole.yaml
      - hasDocuments:
          count: 0
        template: prometheus/prometheus.ClusterRoleBinding.yaml
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: prometheus
        template: prometheus/prometheus.RoleBinding.yaml
      - equal:
          path: roleRef.name
          value: view
        template: prometheus/prometheus.RoleBinding.yaml

  - it: should create a ClusterRole and ClusterRoleBinding instead of a RoleBinding when prometheus.privileged=true
    set:
      prometheus.privileged: true
    asserts:
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: prometheus
        template: prometheus/prometheus.ClusterRole.yaml
      - containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: prometheus
        template: prometheus/prometheus.ClusterRoleBinding.yaml
      - hasDocuments:
          count: 0
        template: prometheus/prometheus.RoleBinding.yaml

  - it: should create no RBAC resources when prometheus.createRoleBinding=false
    set:
      prometheus.createRoleBinding: false
    asserts:
      - hasDocuments:
          count: 0
    templates:
      - prometheus/prometheus.ClusterRole.yaml
      - prometheus/prometheus.ClusterRoleBinding.yaml
      - prometheus/prometheus.RoleBinding.yaml

  - it: should discover pods, services, and endpoints only in the release namespace by default
    template: prometheus/prometheus.ConfigMap.yaml
    asserts:
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "- role: pod\n +namespaces:\n +names:\n +- sourcegraph-test\n"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "- role: service\n +namespaces:\n +names:\n +- sourcegraph-test\n"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "- role: endpoints\n +namespaces:\n +names:\n +- sourcegraph-test\n"
      # No service discovery without a namespace list: the view RoleBinding cannot list other namespaces
      - notMatchRegex:
          path: data["prometheus.yml"]
          pattern: "- role: \\w+\n *\n"
      - notMatchRegex:
          path: data["prometheus.yml"]
          pattern: "job_name: 'kubernetes-(apiservers|nodes)'"

  - it: should keep pods and services scoped to the release namespace when prometheus.privileged=true
    set:
      prometheus.privileged: true
    template: prometheus/prometheus.ConfigMap.yaml
    asserts:
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "- role: pod\n +namespaces:\n +names:\n +- sourcegraph-test\n"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "- role: service\n +namespaces:\n +names:\n +- sourcegraph-test\n"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "job_name: 'kubernetes-apiservers'"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "job_name: 'kubernetes-nodes'"
