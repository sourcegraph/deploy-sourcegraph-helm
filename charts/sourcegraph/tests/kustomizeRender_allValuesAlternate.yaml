# Used by CI: the "Render charts through kustomize" GitHub Actions job
# (.github/workflows/kustomize_render.yml) renders this chart with this file
# through scripts/ci/kustomize-render.sh.
#
# The other side of each either-or choice in kustomizeRender_allValues.yaml:
# local development mode, selector label overrides,
# existing Secrets and ConfigMaps, ingress hosts and TLS lists, no RBAC, an
# existing StorageClass, emptyDir caches, and the otel-agent as a Deployment.
# All names and endpoints are placeholders.

# Every generic per-component value, merged into each component below. Label
# and annotation keys differ from the global ones in sourcegraph.
x-component: &component
  enabled: true
  image:
    tag: 1.2.3-override
    repository: registry.example.com/override
    defaultTagPrefix: example-
  labels:
    example.com/component-label: component
  podLabels:
    example.com/component-pod-label: component
  podAnnotations:
    example.com/component-pod-annotation: component
  serviceLabels:
    example.com/component-service-label: component
  serviceAnnotations:
    example.com/component-service-annotation: component
  serviceType: LoadBalancer
  extraServicePorts:
    - name: example
      port: 9999
      targetPort: 9999
  storageLabels:
    example.com/component-storage-label: component
  storageAnnotations:
    example.com/component-storage-annotation: component
  storageSize: 123Gi
  storageSubPath: example-subpath
  volumeName: example-pv
  extraSelectorLabels:
    example.com/component-selector: component
  env:
    EXAMPLE_VALUE:
      value: example
    EXAMPLE_SECRET:
      valueFrom:
        secretKeyRef:
          name: example-secret
          key: EXAMPLE_SECRET
  resources:
    limits:
      cpu: "3"
      memory: 3Gi
      ephemeral-storage: 3Gi
    requests:
      cpu: 300m
      memory: 300Mi
      ephemeral-storage: 1Gi
  containerSecurityContext:
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  podSecurityContext:
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
  extraVolumes:
    - name: example-extra
      emptyDir: {}
  extraVolumeMounts:
    - name: example-extra
      mountPath: /example-extra
  extraContainers:
    - name: example-sidecar
      image: registry.example.com/example-sidecar:1.0.0
  extraInitContainers:
    - name: example-init
      image: registry.example.com/example-init:1.0.0
      command: [sh, -c, "true"]
  serviceAccount:
    create: true
    annotations:
      example.com/service-account-annotation: component
  nodeSelector:
    example.com/node-pool: component
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                example.com/anti-affinity: component
            topologyKey: kubernetes.io/hostname
  tolerations:
    - key: example.com/node-pool
      operator: Equal
      value: component
      effect: NoSchedule
  priorityClassName: component-priority
  preShutdownPause: 7s
  gracefulShutdownTimeout: 20s
  terminationGracePeriodSeconds: 40
  podDisruptionBudget:
    maxUnavailable: 1

nameOverride: example-sourcegraph
sourcegraph:
  image:
    defaultTag: 1.2.3
    pullPolicy: Always
    repository: registry.example.com/sourcegraph
    useGlobalTagAsDefault: true
  imagePullSecrets:
  - name: registry-credentials
  labels:
    example.com/global-label: global
  podLabels:
    example.com/global-pod-label: global
  podAnnotations:
    example.com/global-pod-annotation: global
  serviceLabels:
    example.com/global-service-label: global
  nodeSelector:
    example.com/node-pool: global
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: example.com/node-pool
            operator: Exists
  tolerations:
  - key: example.com/global
    operator: Exists
    effect: NoSchedule
  priorityClassName: global-priority
  revisionHistoryLimit: 5
  preShutdownPause: 6s
  gracefulShutdownTimeout: 18s
  terminationGracePeriodSeconds: 35
  localDevMode: true
  selectorLabelsOverride:
    example.com/installation: example
    example.com/project: sourcegraph
storageClass:
  create: false
  name: example-existing
alpine:
  containerSecurityContext:
    capabilities:
      drop:
      - ALL
sgTestConnection:
  enabled: true
priorityClasses:
- name: example-priority
  value: 1000
  preemptionPolicy: Never
  description: Example priority
extraResources:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: example-extra
  data:
    key: value

cadvisor:
  <<: *component
  name: example-cadvisor
  serviceAccount:
    create: true
    name: example-cadvisor
    annotations:
      example.com/service-account-annotation: component
  containerSecurityContext:
    capabilities:
      drop:
      - ALL
    privileged: false

codeInsightsDB:
  <<: *component
  name: example-code-insights-d-b
  serviceAccount:
    create: true
    name: example-code-insights-d-b
    annotations:
      example.com/service-account-annotation: component
  auth:
    existingSecret: code-insights-d-b-credentials
  existingConfig: code-insights-d-b-config
  postgresExporter:
    env:
      EXAMPLE_EXPORTER:
        value: example
  init:
    containerSecurityContext:
      capabilities:
        drop:
        - ALL

codeIntelDB:
  <<: *component
  name: example-code-intel-d-b
  serviceAccount:
    create: true
    name: example-code-intel-d-b
    annotations:
      example.com/service-account-annotation: component
  auth:
    existingSecret: code-intel-d-b-credentials
  existingConfig: code-intel-d-b-config
  postgresExporter:
    env:
      EXAMPLE_EXPORTER:
        value: example

frontend:
  <<: *component
  name: example-frontend
  serviceAccount:
    create: true
    name: example-frontend
    annotations:
      example.com/service-account-annotation: component
  replicaCount: 3
  command:
  - /bin/sh
  - -c
  - exec /usr/local/bin/frontend serve
  internalServiceType: NodePort
  privileged: false
  createRoleBinding: false
  ingress:
    enabled: true
    ingressClassName: example
    annotations:
      kubernetes.io/ingress.class: null
      example.com/ingress-annotation: example
    labels:
      example.com/ingress-label: example
    hosts:
    - host: sourcegraph.example.com
    - host: code.example.com
    tls:
    - hosts:
      - sourcegraph.example.com
      - code.example.com
      secretName: example-tls

migrator:
  <<: *component
  serviceAccount:
    create: true
    name: example-migrator
    annotations:
      example.com/service-account-annotation: component
  command:
  - /bin/sh
  - -c
  - exec /usr/local/bin/migrator up
  databaseAuthOverrideEnvVars: true

gitserver:
  <<: *component
  name: example-gitserver
  serviceAccount:
    create: true
    name: example-gitserver
    annotations:
      example.com/service-account-annotation: component
  replicaCount: 3
  sshSecret: gitserver-ssh
  storageAccessModes:
  - ReadWriteOncePod

grafana:
  <<: *component
  name: example-grafana
  serviceAccount:
    create: true
    name: example-grafana
    annotations:
      example.com/service-account-annotation: component
  auth:
    existingSecret: grafana-credentials
  existingConfig: grafana-config

indexedSearch:
  <<: *component
  name: example-indexed-search
  serviceAccount:
    create: true
    name: example-indexed-search
    annotations:
      example.com/service-account-annotation: component
  replicaCount: 3
  indexerName: example-indexer
  livenessProbe:
    failureThreshold: 5
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 3
  readinessProbe:
    failureThreshold: 5
    periodSeconds: 10
    timeoutSeconds: 3

indexedSearchIndexer:
  <<: *component
  serviceAccount:
    create: true
    name: example-indexed-search-indexer
    annotations:
      example.com/service-account-annotation: component

blobstore:
  <<: *component
  name: example-blobstore
  serviceAccount:
    create: true
    name: example-blobstore
    annotations:
      example.com/service-account-annotation: component

openTelemetry:
  <<: *component
  serviceAccount:
    create: true
    name: example-open-telemetry
    annotations:
      example.com/service-account-annotation: component
  gateway:
    name: example-otel-gateway
    args:
    - --feature-gates=example
    env:
      EXAMPLE_OTEL:
        value: gateway
    extraInitContainers:
    - name: otel-gateway-init
      image: registry.example.com/example-init:1.0.0
      command:
      - sh
      - -c
      - 'true'
    labels:
      example.com/otel-gateway-label: gateway
    podLabels:
      example.com/otel-gateway-pod-label: gateway
    podAnnotations:
      example.com/otel-gateway-pod-annotation: gateway
    resources:
      limits:
        cpu: '2'
        memory: 2Gi
      requests:
        cpu: 200m
        memory: 200Mi
    serviceAccount:
      create: true
      name: example-otel-gateway
      annotations:
        example.com/sa: gateway
    containerSecurityContext:
      capabilities:
        drop:
        - ALL
    command:
    - /bin/sh
    - -c
    - exec /bin/otelcol-sourcegraph "$@"
    - --
    serviceType: NodePort
    serviceLabels:
      example.com/otel-gateway-service-label: gateway
    serviceAnnotations:
      example.com/otel-gateway-service-annotation: gateway
    extraServicePorts:
    - name: example
      port: 9996
      targetPort: 9996
  agent:
    name: example-otel-agent
    args:
    - --feature-gates=example
    env:
      EXAMPLE_OTEL:
        value: agent
    extraInitContainers:
    - name: otel-agent-init
      image: registry.example.com/example-init:1.0.0
      command:
      - sh
      - -c
      - 'true'
    labels:
      example.com/otel-agent-label: agent
    podLabels:
      example.com/otel-agent-pod-label: agent
    podAnnotations:
      example.com/otel-agent-pod-annotation: agent
    resources:
      limits:
        cpu: '2'
        memory: 2Gi
      requests:
        cpu: 200m
        memory: 200Mi
    serviceAccount:
      create: true
      name: example-otel-agent
      annotations:
        example.com/sa: agent
    containerSecurityContext:
      capabilities:
        drop:
        - ALL
    kind: Deployment
    hostPorts:
      grpcOtlp: 14317
      httpOtlp: 14318
      httpZpages: 15679

nodeExporter:
  <<: *component
  name: example-node-exporter
  serviceAccount:
    create: true
    name: example-node-exporter
    annotations:
      example.com/service-account-annotation: component
  hostPID: false
  extraArgs:
