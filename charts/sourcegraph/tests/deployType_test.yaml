suite: deploy type
release:
  name: sourcegraph
  namespace: sourcegraph
tests:
- it: should identify every worker replica as a Helm deployment
  template: worker/worker.Deployment.yaml
  set:
    worker:
      replicas:
      - jobs: ["job1"]
      - jobs: ["job2"]
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: DEPLOY_TYPE
        value: helm
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: DEPLOY_TYPE
        value: helm
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: DEPLOY_TYPE
        value: helm
    documentIndex: 2
- it: should not set DEPLOY_TYPE on any other container
  templates:
  - frontend/sourcegraph-frontend.Deployment.yaml
  - gitserver/gitserver.StatefulSet.yaml
  - indexed-search/indexed-search.StatefulSet.yaml
  - precise-code-intel/worker.Deployment.yaml
  - searcher/searcher.StatefulSet.yaml
  - syntactic-code-intel/worker.Deployment.yaml
  - syntect-server/syntect-server.Deployment.yaml
  set:
    syntacticCodeIntel.enabled: true
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: DEPLOY_TYPE
      any: true
  - notContains:
      path: spec.template.spec.containers[1].env
      content:
        name: DEPLOY_TYPE
      any: true
    template: indexed-search/indexed-search.StatefulSet.yaml
  - notContains:
      path: spec.template.spec.initContainers[0].env
      content:
        name: DEPLOY_TYPE
      any: true
    template: frontend/sourcegraph-frontend.Deployment.yaml
- it: should not set any env on blobstore
  template: blobstore/blobstore.Deployment.yaml
  asserts:
  - isNullOrEmpty:
      path: spec.template.spec.containers[0].env
