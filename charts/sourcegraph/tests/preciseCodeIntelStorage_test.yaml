---
suite: preciseCodeIntelStorage
templates:
- precise-code-intel/worker.Deployment.yaml
tests:
- it: should back tmpdir with a plain emptyDir by default
  asserts:
  - contains:
      path: spec.template.spec.volumes
      content:
        name: tmpdir
        emptyDir: {}
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        mountPath: /tmp
        name: tmpdir

- it: should set sizeLimit when storageSize is set on the emptyDir branch
  set:
    preciseCodeIntel:
      storageType: emptyDir
      storageSize: 20Gi
  asserts:
  - contains:
      path: spec.template.spec.volumes
      content:
        name: tmpdir
        emptyDir:
          sizeLimit: 20Gi

- it: should back tmpdir with a per-pod PVC when storageType=pvc
  set:
    preciseCodeIntel:
      storageType: pvc
      storageSize: 50Gi
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].name
      value: tmpdir
  - equal:
      path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.spec
      value:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
  # /tmp mount is unchanged, so no TMPDIR redirect is needed
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        mountPath: /tmp
        name: tmpdir

# The per-pod claim needs a Delete-policy class; storageClass is Retain.
- it: should omit storageClassName by default so the cluster default class is used
  set:
    preciseCodeIntel:
      storageType: pvc
      storageSize: 50Gi
  asserts:
  - notExists:
      path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.spec.storageClassName

- it: should not inherit storageClass.name
  set:
    storageClass:
      name: custom-ssd
    preciseCodeIntel:
      storageType: pvc
      storageSize: 50Gi
  asserts:
  - notExists:
      path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.spec.storageClassName

- it: should use preciseCodeIntel.storageClassName when set
  set:
    storageClass:
      name: custom-ssd
    preciseCodeIntel:
      storageType: pvc
      storageSize: 50Gi
      storageClassName: premium-rwo
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.spec.storageClassName
      value: premium-rwo

# The chart version is part of the helm.sh/chart label, so pin it to compare whole label sets.
- it: should label the per-pod PVC like the chart's other PVCs, with storageLabels added
  release:
    name: sourcegraph
  chart:
    version: 1.2.3
    appVersion: 1.2.3
  set:
    sourcegraph:
      labels:
        example.com/project: sourcegraph
    preciseCodeIntel:
      storageType: pvc
      storageSize: 50Gi
      storageLabels:
        example.com/service: scratch
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.metadata
      value:
        labels:
          helm.sh/chart: sourcegraph-1.2.3
          app.kubernetes.io/name: sourcegraph
          app.kubernetes.io/instance: sourcegraph
          app.kubernetes.io/version: 1.2.3
          app.kubernetes.io/managed-by: Helm
          example.com/project: sourcegraph
          example.com/service: scratch
          deploy: sourcegraph
          app.kubernetes.io/component: precise-code-intel

- it: should add only the chart's own labels to the per-pod PVC when no label value is set
  release:
    name: sourcegraph
  chart:
    version: 1.2.3
    appVersion: 1.2.3
  set:
    preciseCodeIntel:
      storageType: pvc
      storageSize: 50Gi
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.metadata
      value:
        labels:
          helm.sh/chart: sourcegraph-1.2.3
          app.kubernetes.io/name: sourcegraph
          app.kubernetes.io/instance: sourcegraph
          app.kubernetes.io/version: 1.2.3
          app.kubernetes.io/managed-by: Helm
          deploy: sourcegraph
          app.kubernetes.io/component: precise-code-intel

- it: should ignore storageLabels on the emptyDir branch
  set:
    preciseCodeIntel:
      storageLabels:
        example.com/service: scratch
  asserts:
  - contains:
      path: spec.template.spec.volumes
      content:
        name: tmpdir
        emptyDir: {}

- it: should fail when storageSize is omitted on the pvc branch
  set:
    preciseCodeIntel:
      storageType: pvc
  asserts:
  - failedTemplate:
      errorMessage: preciseCodeIntel.storageSize is required when preciseCodeIntel.storageType is pvc

- it: should fall back to emptyDir when storageType is absent
  set:
    preciseCodeIntel:
      storageType: null
  asserts:
  - contains:
      path: spec.template.spec.volumes
      content:
        name: tmpdir
        emptyDir: {}

- it: should fail on an unknown storageType
  set:
    preciseCodeIntel:
      storageType: PVC
      storageSize: 50Gi
  asserts:
  - failedTemplate:
      errorMessage: 'preciseCodeIntel.storageType must be one of emptyDir, pvc; got "PVC"'

- it: should leave the pod securityContext untouched on the emptyDir branch
  asserts:
  - equal:
      path: spec.template.spec.securityContext
      value: {}

- it: should set fsGroup to the container runAsGroup on the pvc branch so /tmp is writable
  set:
    preciseCodeIntel:
      storageType: pvc
      storageSize: 50Gi
  asserts:
  - equal:
      path: spec.template.spec.securityContext
      value:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch

- it: should keep a user-set fsGroup and other podSecurityContext fields on the pvc branch
  set:
    preciseCodeIntel:
      storageType: pvc
      storageSize: 50Gi
      podSecurityContext:
        fsGroup: 2000
        runAsNonRoot: true
  asserts:
  - equal:
      path: spec.template.spec.securityContext
      value:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
