---
suite: otelCollectorJaeger
tests:
  - it: should use the logging exporter when Jaeger is disabled and no exporter has been set
    template: otel-collector/otel-collector.Deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: [ "/bin/otelcol-sourcegraph", "--config=/etc/otel-collector/configs/logging.yaml" ]
      # The argument serves the collector's own metrics on all interfaces: logging.yaml
      # leaves them on 127.0.0.1, where Prometheus cannot scrape them.
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - '--config=yaml:service::telemetry::metrics::readers: [{pull: {exporter: {prometheus: {host: "0.0.0.0", port: 8888, without_type_suffix: true, without_units: true}}}}]'
      - isEmpty:
          path: spec.template.spec.containers[0].volumeMounts
      - isEmpty:
          path: spec.template.spec.volumes
      - notExists: # no ConfigMap, so nothing to restart for
          path: spec.template.metadata.annotations["checksum/otel-collector-config"]
      - hasDocuments:
          count: 0 # ConfigMap is not rendered
        template: otel-collector/otel-collector.ConfigMap.yaml
  - it: should use the bundled Jaeger config when Jaeger is enabled
    template: otel-collector/otel-collector.Deployment.yaml
    set:
      jaeger:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: [ "/bin/otelcol-sourcegraph", "--config=/etc/otel-collector/configs/jaeger.yaml" ]
      - isEmpty:
          path: spec.template.spec.containers[0].volumeMounts
      - isEmpty:
          path: spec.template.spec.volumes
      - notExists: # no ConfigMap, so nothing to restart for
          path: spec.template.metadata.annotations["checksum/otel-collector-config"]
      - hasDocuments:
          count: 0 # ConfigMap is not rendered
        template: otel-collector/otel-collector.ConfigMap.yaml
  - it: should use the exporter defined in the config
    template: otel-collector/otel-collector.Deployment.yaml
    set:
      openTelemetry:
        gateway:
          config:
            traces:
              exporters:
                otlp:
                  endpoint: "otlp.service.com:443"
                  headers:
                    "x-header-1": "$HEADER1"
                    "x-header-2": "$HEADER2"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: [ "/bin/otelcol-sourcegraph", "--config=/etc/otel-collector/config.yaml" ]
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/otel-collector
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: otel-collector
              items:
                - key: config.yaml
                  path: config.yaml
      # The collector does not reload a changed ConfigMap, so the pod restarts when the values it is rendered from change.
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/otel-collector-config"]
          pattern: ^[0-9a-f]{64}$
      - notEqual: # the hash of `null`, which is what a missing value would hash to
          path: spec.template.metadata.annotations["checksum/otel-collector-config"]
          value: 74234e98afe7498fb5daf1f36ac2d78acc339464f950703b8c019892f982b90b
      - hasDocuments:
          count: 1 # ConfigMap is rendered
        template: otel-collector/otel-collector.ConfigMap.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: otlp.service.com:443" # check if element of config is substituted correctly
        template: otel-collector/otel-collector.ConfigMap.yaml
      - matchRegex:
          path: data["config.yaml"]
          # the collector's own metrics are served on all interfaces, for Prometheus to scrape
          pattern: 'service:\n  telemetry:\n    metrics:\n(\s*#.*\n)*\s*readers: \[\{pull: \{exporter: \{prometheus: \{host: "0\.0\.0\.0", port: 8888, '
        template: otel-collector/otel-collector.ConfigMap.yaml
  - it: should fail if a configuration is provided and jaeger is enabled
    template: otel-collector/otel-collector.ConfigMap.yaml
    set:
      openTelemetry:
        gateway:
          config:
            traces:
              exporters:
                otlp:
                  endpoint: "otlp.service.com:443"
                  headers:
                    "x-header-1": "$HEADER1"
                    "x-header-2": "$HEADER2"
      jaeger:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "Set 'jaeger.enabled' to false or remove 'openTelemetry.gateway.config.exporters'. The bundled jaeger instance is preconfigured."
  - it: should not allow jaeger to be enabled without otelCollector enabled
    template: jaeger/jaeger.Deployment.yaml
    set:
      openTelemetry:
        enabled: false
      jaeger:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "When 'jaeger.enabled' is set to true, 'openTelemetry.enabled' must be set to true as well."
  - it: should have Prometheus scrape jaeger on the port where it serves its metrics
    templates:
      - jaeger/jaeger.Deployment.yaml
      - jaeger/jaeger.ConfigMap.yaml
    set:
      jaeger:
        enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "8888"
        template: jaeger/jaeger.Deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 8888
            name: metrics
            protocol: TCP
        template: jaeger/jaeger.Deployment.yaml
      # On all interfaces: jaeger serves its metrics on localhost only by default.
      - matchRegex:
          path: data["jaeger-config.yaml"]
          pattern: 'prometheus:\n\s+host: "0\.0\.0\.0"\n\s+port: 8888\n'
        template: jaeger/jaeger.ConfigMap.yaml
