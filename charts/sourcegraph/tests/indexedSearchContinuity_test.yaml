suite: indexedSearchContinuity
release:
  name: sourcegraph
  namespace: sourcegraph
templates:
- indexed-search/indexed-search.StatefulSet.yaml
- indexed-search/indexed-search.IndexerService.yaml
- indexed-search/indexed-search.Service.yaml
- indexed-search/indexed-search.PodDisruptionBudget.yaml
- indexed-search/indexed-search.ServiceAccount.yaml
- indexed-searcher/indexed-searcher.StatefulSet.yaml
- indexed-searcher/indexed-searcher.Service.yaml
- indexed-searcher/indexed-searcher.PodDisruptionBudget.yaml
- indexed-searcher/indexed-searcher.ServiceAccount.yaml
- indexed-searcher/indexed-searcher-indexer.Deployment.yaml
- indexed-searcher/indexed-searcher-indexer.Service.yaml
- frontend/sourcegraph-frontend.Deployment.yaml
- gitserver/gitserver.StatefulSet.yaml
- worker/worker.Deployment.yaml
- searcher/searcher.StatefulSet.yaml
tests:
- it: should render no continuity objects and the default indexed-search layout when continuity is disabled
  asserts:
  - hasDocuments:
      count: 0
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - hasDocuments:
      count: 0
    template: indexed-searcher/indexed-searcher.Service.yaml
  - hasDocuments:
      count: 0
    template: indexed-searcher/indexed-searcher-indexer.Deployment.yaml
  - hasDocuments:
      count: 0
    template: indexed-searcher/indexed-searcher-indexer.Service.yaml
  - equal:
      path: metadata.name
      value: indexed-search
    template: indexed-search/indexed-search.StatefulSet.yaml
  - lengthEqual:
      path: spec.template.spec.containers
      count: 2
    template: indexed-search/indexed-search.StatefulSet.yaml
  - equal:
      path: metadata.annotations["prometheus.io/port"]
      value: "6070"
    template: indexed-search/indexed-search.Service.yaml
  - equal:
      path: metadata.name
      value: indexed-search-indexer
    template: indexed-search/indexed-search.IndexerService.yaml
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ENABLED
        value: "true"
    template: frontend/sourcegraph-frontend.Deployment.yaml

- it: should not render the continuity PodDisruptionBudget or ServiceAccount when continuity is disabled
  set:
    indexedSearcher:
      podDisruptionBudget:
        maxUnavailable: 1
      serviceAccount:
        create: true
  asserts:
  - hasDocuments:
      count: 0
    template: indexed-searcher/indexed-searcher.PodDisruptionBudget.yaml
  - hasDocuments:
      count: 0
    template: indexed-searcher/indexed-searcher.ServiceAccount.yaml

- it: should run both fleets with distinct names when continuity is enabled
  set:
    indexedSearch:
      continuity:
        enabled: true
  asserts:
  - equal:
      path: metadata.name
      value: indexed-search
    template: indexed-search/indexed-search.StatefulSet.yaml
  - lengthEqual:
      path: spec.template.spec.containers
      count: 2
    template: indexed-search/indexed-search.StatefulSet.yaml
  - equal:
      path: metadata.name
      value: indexed-search
    template: indexed-search/indexed-search.Service.yaml
  - equal:
      path: metadata.annotations["prometheus.io/port"]
      value: "6070"
    template: indexed-search/indexed-search.Service.yaml
  - equal:
      path: metadata.name
      value: indexed-search-indexer
    template: indexed-search/indexed-search.IndexerService.yaml
  - equal:
      path: spec.selector.app
      value: indexed-search
    template: indexed-search/indexed-search.IndexerService.yaml
  - equal:
      path: metadata.name
      value: indexed-searcher
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.serviceName
      value: indexed-searcher
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.selector.matchLabels.app
      value: indexed-searcher
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: metadata.name
      value: indexed-searcher
    template: indexed-searcher/indexed-searcher.Service.yaml
  - equal:
      path: spec.selector.app
      value: indexed-searcher
    template: indexed-searcher/indexed-searcher.Service.yaml
  - equal:
      path: metadata.name
      value: indexed-searcher-indexer
    template: indexed-searcher/indexed-searcher-indexer.Deployment.yaml
  - equal:
      path: spec.template.metadata.labels.app
      value: indexed-searcher-indexer
    template: indexed-searcher/indexed-searcher-indexer.Deployment.yaml
  - equal:
      path: metadata.name
      value: indexed-searcher-indexer
    template: indexed-searcher/indexed-searcher-indexer.Service.yaml
  - equal:
      path: spec.selector.app
      value: indexed-searcher-indexer
    template: indexed-searcher/indexed-searcher-indexer.Service.yaml

- it: should run a single continuity webserver container in indexed-searcher
  set:
    indexedSearch:
      continuity:
        enabled: true
    indexedSearcher:
      image:
        repository: sg-local
        tag: dev
  template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  asserts:
  - lengthEqual:
      path: spec.template.spec.containers
      count: 1
  - equal:
      path: spec.template.spec.containers[0].name
      value: zoekt-continuity-webserver
  - equal:
      path: spec.template.spec.containers[0].image
      value: sg-local/zoekt-continuity-webserver:dev
  - equal:
      path: spec.replicas
      value: 2
  - equal:
      path: spec.podManagementPolicy
      value: OrderedReady
  - equal:
      path: spec.updateStrategy.type
      value: RollingUpdate
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 60
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.httpGet.path
      value: /ready
  - equal:
      path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
      value: 200Gi
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: DATA_DIR
        value: /data/index
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_WARM_REPLICAS
        value: "2"

- it: should default the webserver image tag to the chart appVersion
  set:
    indexedSearch:
      continuity:
        enabled: true
  chart:
    appVersion: 1.2.3
  template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[0].image
      value: index.docker.io/sourcegraph/zoekt-continuity-webserver:1.2.3

- it: should apply the indexedSearcher settings to the webservers
  set:
    indexedSearch:
      continuity:
        enabled: true
    indexedSearcher:
      name: custom-searcher
      replicaCount: 4
      terminationGracePeriodSeconds: 120
      storageSize: 50Gi
      storageClassName: fast
      storageLabels:
        example.com/project: sourcegraph
      podLabels:
        example.com/team: search
      nodeSelector:
        pool: search
      command: ["/bin/webserver"]
      args: ["-v"]
      podDisruptionBudget:
        maxUnavailable: 1
      serviceAccount:
        create: true
  asserts:
  - equal:
      path: metadata.name
      value: custom-searcher
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.serviceName
      value: indexed-searcher
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.replicas
      value: 4
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 120
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
      value: 50Gi
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.volumeClaimTemplates[0].spec.storageClassName
      value: fast
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.volumeClaimTemplates[0].metadata.labels["example.com/project"]
      value: sourcegraph
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.template.metadata.labels["example.com/team"]
      value: search
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.template.spec.nodeSelector.pool
      value: search
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.template.spec.containers[0].command
      value: ["/bin/webserver"]
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.template.spec.containers[0].args
      value: ["-v"]
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.template.spec.serviceAccountName
      value: custom-searcher
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - equal:
      path: spec.template.spec.serviceAccountName
      value: custom-searcher
    template: indexed-searcher/indexed-searcher-indexer.Deployment.yaml
  - equal:
      path: metadata.name
      value: custom-searcher
    template: indexed-searcher/indexed-searcher.ServiceAccount.yaml
  - equal:
      path: metadata.name
      value: custom-searcher
    template: indexed-searcher/indexed-searcher.PodDisruptionBudget.yaml
  - equal:
      path: spec.selector.matchLabels.app
      value: indexed-searcher
    template: indexed-searcher/indexed-searcher.PodDisruptionBudget.yaml
  - equal:
      path: metadata.name
      value: indexed-searcher
    template: indexed-searcher/indexed-searcher.Service.yaml

- it: should add the indexer and shared continuity env when enabled
  set:
    indexedSearch:
      continuity:
        enabled: true
  asserts:
  - equal:
      path: spec.replicas
      value: 2
    template: indexed-searcher/indexed-searcher-indexer.Deployment.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ENABLED
        value: "true"
    template: indexed-searcher/indexed-searcher-indexer.Deployment.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ENABLED
        value: "true"
    template: frontend/sourcegraph-frontend.Deployment.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ENABLED
        value: "true"
    template: worker/worker.Deployment.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ENABLED
        value: "true"
    template: gitserver/gitserver.StatefulSet.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ACTIVATION_TOLERANCE
        value: "1"
    template: searcher/searcher.StatefulSet.yaml

- it: should route searches to the continuity webservers by default
  set:
    indexedSearch:
      continuity:
        enabled: true
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ROUTING
        value: "true"
    template: frontend/sourcegraph-frontend.Deployment.yaml

- it: should pass routing false to the services that search while continuity runs in shadow
  set:
    indexedSearch:
      continuity:
        enabled: true
        routing: false
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ROUTING
        value: "false"
    template: frontend/sourcegraph-frontend.Deployment.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ROUTING
        value: "false"
    template: worker/worker.Deployment.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ROUTING
        value: "false"
    template: searcher/searcher.StatefulSet.yaml
  # Switching routing must not restart services that do not read it.
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ROUTING
        value: "false"
    template: gitserver/gitserver.StatefulSet.yaml
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ROUTING
        value: "false"
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_ROUTING
        value: "false"
    template: indexed-searcher/indexed-searcher-indexer.Deployment.yaml
  - hasDocuments:
      count: 1
    template: indexed-search/indexed-search.StatefulSet.yaml

- it: should remove the indexed-search objects when indexedSearch.enabled is false
  set:
    indexedSearch:
      enabled: false
      podDisruptionBudget:
        maxUnavailable: 1
      serviceAccount:
        create: true
      continuity:
        enabled: true
  asserts:
  - hasDocuments:
      count: 0
    template: indexed-search/indexed-search.StatefulSet.yaml
  - hasDocuments:
      count: 0
    template: indexed-search/indexed-search.Service.yaml
  - hasDocuments:
      count: 0
    template: indexed-search/indexed-search.IndexerService.yaml
  - hasDocuments:
      count: 0
    template: indexed-search/indexed-search.PodDisruptionBudget.yaml
  - hasDocuments:
      count: 0
    template: indexed-search/indexed-search.ServiceAccount.yaml
  - hasDocuments:
      count: 1
    template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  - hasDocuments:
      count: 1
    template: indexed-searcher/indexed-searcher-indexer.Deployment.yaml

- it: should scrape continuity metrics from the debug port
  set:
    indexedSearch:
      continuity:
        enabled: true
  asserts:
  - equal:
      path: metadata.annotations["prometheus.io/port"]
      value: "6060"
    template: indexed-searcher/indexed-searcher.Service.yaml
  - equal:
      path: metadata.annotations["prometheus.io/port"]
      value: "6060"
    template: indexed-searcher/indexed-searcher-indexer.Service.yaml
  - equal:
      path: metadata.annotations["sourcegraph.prometheus/scrape"]
      value: "true"
    template: indexed-searcher/indexed-searcher-indexer.Service.yaml

- it: should pass replication factors to every participant
  set:
    indexedSearch:
      continuity:
        enabled: true
        replicationFactors: "12345=3"
  template: worker/worker.Deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SRC_INDEXED_SEARCH_CONTINUITY_REPLICATION_FACTORS
        value: "12345=3"

- it: should reject more continuity replicas than indexed-searcher pods
  set:
    indexedSearch:
      replicaCount: 3
      continuity:
        enabled: true
    indexedSearcher:
      replicaCount: 1
  template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  asserts:
  - failedTemplate:
      errorMessage: indexedSearch.continuity.replicas must not exceed indexedSearcher.replicaCount

- it: should reject an activation tolerance as large as the replicas
  set:
    indexedSearch:
      continuity:
        enabled: true
        replicas: 2
        activationTolerance: 2
  template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  asserts:
  - failedTemplate:
      errorMessage: indexedSearch.continuity.activationTolerance must be less than indexedSearch.continuity.replicas

- it: should reject a webserver termination grace period below 30 seconds
  set:
    indexedSearch:
      continuity:
        enabled: true
    indexedSearcher:
      terminationGracePeriodSeconds: 10
  template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  asserts:
  - failedTemplate:
      errorMessage: indexedSearcher.terminationGracePeriodSeconds must be at least 30

- it: should reject routing false once indexed-search is removed
  set:
    indexedSearch:
      enabled: false
      continuity:
        enabled: true
        routing: false
  template: indexed-searcher/indexed-searcher.StatefulSet.yaml
  asserts:
  - failedTemplate:
      errorMessage: "indexedSearch.continuity.routing must be true when indexedSearch.enabled is false: searches would go to the removed indexed-search StatefulSet"
