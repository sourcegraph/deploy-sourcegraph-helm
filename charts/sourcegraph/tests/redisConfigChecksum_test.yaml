suite: redis config checksum
templates:
  - templates/redis/redis-store.Deployment.yaml
  - templates/redis/redis-cache.Deployment.yaml
tests:
  # The checksum must cover the rendered redis.conf body and nothing else.
  # Hashing the whole ConfigMap manifest pulls in the helm.sh/chart label, so
  # every chart build changes it and restarts redis even when the config is
  # byte-identical. These pin the hash for a fixed config, so any change that
  # lets unrelated input back in fails here.
  #
  # Editing a vendored files/redis-*/redis.conf changes these hashes on purpose.
  # Re-pin by rendering the ConfigMap for the same values and hashing its
  # redis.conf body, e.g.
  #   helm template charts/sourcegraph --set redisStore.config.enabled=true \
  #     --set redisStore.resources.limits.memory=7Gi \
  #     -s templates/redis/redis-store.ConfigMap.yaml
  - it: pins the redis-store checksum for a fixed config
    templates:
      - templates/redis/redis-store.Deployment.yaml
    set:
      redisStore.config.enabled: true
      redisStore.resources.limits.memory: 7Gi
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/redis-config"]
          value: &pinnedStoreChecksum f65e9a885e0fd9df5e9f4c3dc6dbcf5b05f11b997d375f5272f7a3c9397f65e5

  - it: pins the redis-cache checksum for a fixed config
    templates:
      - templates/redis/redis-cache.Deployment.yaml
    set:
      redisCache.config.enabled: true
      redisCache.resources.limits.memory: 10Gi
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/redis-config"]
          value: 0a0f0bb343c5d37ed52bcebf58fd3dbe10f54423c9d920aa90ac8504ee108877

  # The chart version is the specific input that caused the fleet-wide restarts:
  # it is bumped on every release and reached the hash via the ConfigMap labels.
  - it: does not change when only the chart version changes
    templates:
      - templates/redis/redis-cache.Deployment.yaml
    chart:
      version: 8.0.0
      appVersion: 8.0.0
    set:
      redisCache.config:
        enabled: true
        maxmemory: 1gb
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/redis-config"]
          value: &pinnedCacheChecksum 57f261f5131adbefd08fe4181b50b898b68f386949f8bbc10f747da37e178f74

  - it: keeps the same checksum on a later chart version
    templates:
      - templates/redis/redis-cache.Deployment.yaml
    chart:
      version: 9.9.9
      appVersion: 9.9.9
    set:
      redisCache.config:
        enabled: true
        maxmemory: 1gb
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/redis-config"]
          value: *pinnedCacheChecksum

  - it: changes when an explicit maxmemory changes
    templates:
      - templates/redis/redis-cache.Deployment.yaml
    chart:
      version: 9.9.9
      appVersion: 9.9.9
    set:
      redisCache.config:
        enabled: true
        maxmemory: 2gb
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/redis-config"]
          value: *pinnedCacheChecksum

  # Unrelated input must not reach the hash. These are the regressions that
  # caused redis to roll on every chart build.
  - it: does not change when an unrelated global label changes
    templates:
      - templates/redis/redis-store.Deployment.yaml
    set:
      redisStore.config.enabled: true
      redisStore.resources.limits.memory: 7Gi
      sourcegraph.labels.team: platform
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/redis-config"]
          value: *pinnedStoreChecksum

  - it: does not change when the sourcegraph image tag changes
    templates:
      - templates/redis/redis-store.Deployment.yaml
    set:
      redisStore.config.enabled: true
      redisStore.resources.limits.memory: 7Gi
      sourcegraph.image.tag: some-new-build
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/redis-config"]
          value: *pinnedStoreChecksum

  # Real config changes must still roll redis, otherwise the annotation is useless.
  - it: changes when the memory limit changes the derived maxmemory
    templates:
      - templates/redis/redis-store.Deployment.yaml
    set:
      redisStore.config.enabled: true
      redisStore.resources.limits.memory: 14Gi
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/redis-config"]
          value: *pinnedStoreChecksum

  - it: changes when maxmemoryPolicy is set
    templates:
      - templates/redis/redis-store.Deployment.yaml
    set:
      redisStore.config.enabled: true
      redisStore.resources.limits.memory: 7Gi
      redisStore.config.maxmemoryPolicy: allkeys-lru
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/redis-config"]
          value: *pinnedStoreChecksum

  - it: changes when additionalConfig is set
    templates:
      - templates/redis/redis-store.Deployment.yaml
    set:
      redisStore.config.enabled: true
      redisStore.resources.limits.memory: 7Gi
      redisStore.config.additionalConfig: io-threads 4
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/redis-config"]
          value: *pinnedStoreChecksum

  - it: is absent when the chart-managed config is disabled
    set:
      redisStore.config.enabled: false
      redisCache.config.enabled: false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/redis-config"]

  - it: is absent when an existingConfig is supplied
    set:
      redisStore.config.enabled: true
      redisCache.config.enabled: true
      redisStore.config.existingConfig: my-own-redis-conf
      redisCache.config.existingConfig: my-own-redis-conf
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/redis-config"]
