# Override file demonstrating the use of external Object Storage services
# Learn more from the tutorial below
# - https://docs.sourcegraph.com/admin/install/kubernetes/helm#using-external-object-storage

# Using a GCP GCS bucket, with workload identity authentication

# Disable deployment of the built-in object storage
blobstore:
  enabled: false

# Use YAML anchors and aliases to keep override file clean
x-object-storage-env: &objectStorageEnv
  SOURCEGRAPH_UPLOAD_BACKEND:
    value: GCS
  SOURCEGRAPH_UPLOAD_BUCKET:
    value: sourcegraph-bucket
  SOURCEGRAPH_UPLOAD_MANAGE_BUCKET:
    value: "false"

# Syntactic Code Intel uses the legacy precise Code Intel upload store configuration
x-syntactic-code-intel-env: &syntacticCodeIntelEnv
  PRECISE_CODE_INTEL_UPLOAD_BACKEND:
    value: GCS
  PRECISE_CODE_INTEL_UPLOAD_BUCKET:
    value: sourcegraph-bucket
  PRECISE_CODE_INTEL_UPLOAD_GCP_PROJECT_ID:
    value: sourcegraph-project
  PRECISE_CODE_INTEL_UPLOAD_MANAGE_BUCKET:
    value: "false"

# Pods must run using a Kubernetes service account configured for Workload Identity
x-service-account: &serviceAccount
  create: false
  name: sourcegraph-workload-identity

# Apply the shared object storage config to its authoritative consumers
frontend:
  env:
    <<: *objectStorageEnv
  serviceAccount: *serviceAccount

preciseCodeIntel:
  env:
    <<: *objectStorageEnv
  serviceAccount: *serviceAccount

gitserver:
  env:
    <<: *objectStorageEnv
  serviceAccount: *serviceAccount

searcher:
  env:
    <<: *objectStorageEnv
  serviceAccount: *serviceAccount

worker:
  env:
    <<: *objectStorageEnv
  serviceAccount: *serviceAccount

# Configure syntactic Code Intel's separate legacy precise upload store
syntacticCodeIntel:
  env:
    <<: *syntacticCodeIntelEnv
  serviceAccount: *serviceAccount
