# Override file for routing outbound HTTP(S) traffic through an HTTP proxy
# ex. telemetry, pings, update checks, and license verification to services.sourcegraph.com,
# and connections to code hosts, auth providers, and LLM providers outside your private network
# See https://sourcegraph.com/docs/self-hosted/private-network#http-proxy-configuration

# Reusable block of environment variables, for all services which initiate outbound connections
# This key is not read by the chart, it only holds the YAML anchor
proxyEnvVars: &proxy-env-vars
  HTTP_PROXY:
    value: http://proxy.example.com:8080
  HTTPS_PROXY:
    value: http://proxy.example.com:8080
  # Bypass the proxy for traffic between Sourcegraph's own services
  # If pods fail their readiness or health checks after adding the proxy, also add the cluster's pod and service CIDR ranges, ex. 10.10.0.0/16,10.20.0.0/16
  NO_PROXY:
    value: blobstore,codeinsights-db,codeintel-db,sourcegraph-frontend-internal,sourcegraph-frontend,gitserver,grafana,indexed-search-indexer,indexed-search,jaeger-query,pgsql,precise-code-intel-worker,prometheus,redis-cache,redis-store,searcher,syntect-server,worker-executors,worker,cloud-sql-proxy,localhost,127.0.0.1,.svc,.svc.cluster.local,kubernetes.default.svc

frontend:
  env:
    <<: *proxy-env-vars
    # To proxy only pings and update checks, instead of all outbound traffic,
    # set this var alone, and drop the HTTP_PROXY / HTTPS_PROXY / NO_PROXY vars
    # TELEMETRY_HTTP_PROXY:
    #   value: http://proxy.example.com:8080

gitserver:
  env:
    <<: *proxy-env-vars

migrator:
  env:
    <<: *proxy-env-vars

worker:
  env:
    <<: *proxy-env-vars

# Executors are deployed from the separate sourcegraph-executor chart
# Add the same env vars to its executor.extraEnv list
