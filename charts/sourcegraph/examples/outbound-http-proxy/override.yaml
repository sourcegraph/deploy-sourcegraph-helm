# Override file for routing outbound HTTP(S) traffic through an HTTP proxy
# ex. telemetry, update checks, and license verification to services.sourcegraph.com,
# and connections to code hosts, auth providers, and LLM providers outside your private network
# See https://sourcegraph.com/docs/self-hosted/private-network#http-proxy-configuration

# Reusable block of environment variables, for services which initiate outbound connections
proxyEnvVars: &proxy-env-vars
  HTTP_PROXY:
    value: http://proxy.example.com:8080
  HTTPS_PROXY:
    value: http://proxy.example.com:8080
  # Skip the proxy for local traffic
  # Add your internal code hosts, auth providers, image registries, etc. which are reachable without the proxy
  # If pods fail their readiness or health checks after adding the proxy, also add the cluster's pod and service CIDR ranges, ex. 10.10.0.0/16,10.20.0.0/16
  # Each line needs a trailing comma, as YAML folds these lines into one line, separated by spaces
  NO_PROXY:
    value: >-
      blobstore,
      cloud-sql-proxy,
      codeinsights-db,
      codeintel-db,
      gitserver,
      grafana,
      indexed-search,
      indexed-search-indexer,
      jaeger-query,
      pgsql,
      precise-code-intel-worker,
      prometheus,
      redis-cache,
      redis-store,
      searcher,
      sourcegraph-frontend,
      sourcegraph-frontend-internal,
      syntect-server,
      worker,
      worker-executors,
      localhost,
      127.0.0.1,
      .svc,
      .svc.cluster.local,
      kubernetes.default.svc

frontend:
  env:
    <<: *proxy-env-vars

# Uncomment if connections to code hosts outside your private network need to use the proxy
# gitserver:
#   env:
#     <<: *proxy-env-vars

# The default `up` command makes no outbound connections
# `drift`, `upgrade`, and `downgrade` check releaseregistry.sourcegraph.com for a newer migrator version,
# and storage.googleapis.com for schema descriptions
migrator:
  env:
    <<: *proxy-env-vars

worker:
  env:
    <<: *proxy-env-vars
