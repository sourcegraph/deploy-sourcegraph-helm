## Demonstrates how to create a subchart of the Sourcegraph helm chart
## in order to add additional custom resources

# Create a variable that is used as the name of the custom NetworkPolicy resource
policyName: deny-ingress-from-other-namespaces

sg: # Matches alias name of the dependency in Chart.yaml
  # The alias replaces the chart name in the app.kubernetes.io/name selector label.
  # Keep the name of a standalone install, so a release can move between the two.
  # New installs only: a release already installed with the alias and without this line
  # has `sg` in its selectors. Leave the line out there, or the upgrade fails,
  # because Kubernetes does not allow changing a selector.
  nameOverride: sourcegraph
  sourcegraph: # Shown here to emphasize indentation
    podLabels:
      new-label: "custom" # Added to all pods
