openTelemetry:
  gateway:
    env:
      JAEGER_HOST:
        value: "your.jaeger.endpoint"
    config:
      traces:
        exportersTlsSecretName: otel-collector-exporters-tls
        exporters:
          otlp:
            endpoint: "${env:JAEGER_HOST}:4317"
            tls:
              cert_file: /tls/file.cert
              key_file: /tls/file.key
