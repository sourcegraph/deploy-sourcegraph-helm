name: Checkov Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checkov-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov
        
      - name: Write skip checks config
        run: |
            echo "${{ vars.CHECKOV_SKIP_CHECKS }}" > .checkov.yaml

      - name: Run Checkov scan
        run: |
          checkov -d ./charts --output cli --output sarif --output-file-path console,results.sarif
        continue-on-error: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: results.sarif
