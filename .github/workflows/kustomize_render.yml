name: Render charts through kustomize
on:
  push:
    branches:
      - main
      - release/**
  pull_request:

jobs:
  kustomize-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the Helm version in .tool-versions, the same one Buildkite uses.
      # kubectl, with its built-in kustomize, comes with the runner image.
      - name: Set up Helm
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: helm

      - name: Render each chart's tests/kustomizeRender_*.yaml and build it with kustomize
        run: scripts/ci/kustomize-render.sh
